<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <title>ALYA — Bienvenida</title>
    <style>
        :root {
            --bg: #0a0e14;
            --panel: #121821;
            --panel-border: #202b38;
            --pink: #ff5ea8;
            --cyan: #4fd1ff;
            --text: #e4edf5;
            --dim: #9db0c2;
            --danger: #ff5f5f;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background:
                linear-gradient(rgba(79, 209, 255, 0.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(79, 209, 255, 0.035) 1px, transparent 1px),
                var(--bg);
            background-size: 22px 22px, 22px 22px, auto;
            color: var(--text);
            font-family: 'Segoe UI', system-ui, sans-serif;
            padding: 28px 26px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .avatar-big {
            width: 68px;
            height: 68px;
            border-radius: 50%;
            background: conic-gradient(from 200deg, var(--pink), var(--cyan), var(--pink));
            padding: 3px;
            box-shadow: 0 0 24px rgba(79, 209, 255, 0.35), 0 0 10px rgba(255, 94, 168, 0.25);
            margin-bottom: 14px;
        }

        .avatar-big img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            display: block;
        }

        h1 {
            font-size: 20px;
            margin: 0 0 6px;
            font-weight: 700;
            background: linear-gradient(90deg, var(--pink), var(--cyan));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 13px;
            color: var(--dim);
            margin-bottom: 26px;
            line-height: 1.5;
            max-width: 340px;
        }

        .step {
            width: 100%;
            max-width: 380px;
            background: var(--panel);
            border: 1px solid var(--panel-border);
            border-left: 2px solid var(--cyan);
            border-radius: 10px;
            padding: 16px 18px;
            text-align: left;
            margin-bottom: 16px;
        }

        .step-title {
            font-size: 11px;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: var(--dim);
            font-family: 'Cascadia Code', 'Consolas', monospace;
            margin-bottom: 8px;
        }

        .step p {
            font-size: 13px;
            line-height: 1.5;
            margin: 0 0 12px;
            color: var(--text);
        }

        .step a {
            color: var(--cyan);
            text-decoration: none;
        }

        .step a:hover {
            text-decoration: underline;
        }

        input[type="text"] {
            width: 100%;
            background: #0d1219;
            border: 1px solid var(--panel-border);
            color: var(--text);
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 13px;
            outline: none;
            font-family: 'Cascadia Code', 'Consolas', monospace;
        }

        input[type="text"]:focus {
            border-color: var(--cyan);
        }

        button {
            background: linear-gradient(135deg, var(--pink), var(--cyan));
            color: #0a0e14;
            border: none;
            border-radius: 8px;
            padding: 12px 14px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            max-width: 380px;
            transition: transform 0.1s, opacity 0.15s;
        }

        button:hover:not(:disabled) {
            transform: scale(1.01);
        }

        button:disabled {
            opacity: 0.5;
            cursor: default;
        }

        #error-msg {
            color: var(--danger);
            font-size: 12px;
            margin-top: 10px;
            min-height: 16px;
        }

        #skip-link {
            margin-top: 16px;
            font-size: 12px;
            color: var(--dim);
            cursor: pointer;
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="avatar-big"><img id="avatar-img" src="build/avatar.png" alt="ALYA" /></div>
    <h1>Hola, soy ALYA</h1>
    <div class="subtitle">
        Antes de empezar, necesito una clave de Gemini para poder pensar —
        es gratis y solo toma un minuto.
    </div>

    <div class="step">
        <div class="step-title">1. Consigue tu clave gratis</div>
        <p>
            Entra a <a href="#" id="ai-studio-link">aistudio.google.com</a>,
            inicia sesión con tu cuenta de Google, y genera una API key nueva.
        </p>

        <div class="step-title">2. Pégala acá</div>
        <input type="text" id="api-key-input" placeholder="Pega tu API key de Gemini aquí..." />
    </div>

    <button id="save-btn">Guardar y continuar</button>
    <div id="error-msg"></div>
    <div id="skip-link">Prefiero configurarlo después</div>

    <script>
        window.alyaSetup.getAvatarUrl().then((url) => {
            document.getElementById('avatar-img').src = url;
        });

        document.getElementById('ai-studio-link').addEventListener('click', (e) => {
            e.preventDefault();
            window.alyaSetup.openLink('https://aistudio.google.com/apikey');
        });

        const input = document.getElementById('api-key-input');
        const saveBtn = document.getElementById('save-btn');
        const errorMsg = document.getElementById('error-msg');
        const skipLink = document.getElementById('skip-link');

        saveBtn.addEventListener('click', async () => {
            const key = input.value.trim();

            if (!key) {
                errorMsg.textContent = 'Pega tu API key antes de continuar.';
                return;
            }

            saveBtn.disabled = true;
            saveBtn.textContent = 'Guardando...';
            errorMsg.textContent = '';

            try {
                await window.alyaSetup.saveApiKey(key);
                // La ventana se cierra sola desde el proceso principal al confirmar.
            } catch (err) {
                errorMsg.textContent = 'No pude guardar la clave: ' + err.message;
                saveBtn.disabled = false;
                saveBtn.textContent = 'Guardar y continuar';
            }
        });

        skipLink.addEventListener('click', () => {
            window.alyaSetup.skip();
        });
    </script>
</body>

</html>
