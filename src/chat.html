<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <title>ALYA</title>
    <style>
        :root {
            --bg: #0a0e14;
            --panel: #121821;
            --panel-border: #202b38;
            --pink: #ff5ea8;
            --cyan: #4fd1ff;
            --text: #e4edf5;
            --dim: #6c7c8c;
            --danger: #ff5f5f;
            --danger-bg: #2a1518;
            --danger-border: #5c2c30;
            --mono: 'Cascadia Code', 'Consolas', 'Courier New', monospace;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            margin: 0;
        }

        body {
            display: flex;
            flex-direction: column;
            background:
                linear-gradient(rgba(79, 209, 255, 0.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(79, 209, 255, 0.035) 1px, transparent 1px),
                var(--bg);
            background-size: 22px 22px, 22px 22px, auto;
            color: var(--text);
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        /* Marcos de esquina tipo HUD, reutilizables en cualquier tarjeta/burbuja */
        .hud-corners {
            position: relative;
        }

        .hud-corners::before,
        .hud-corners::after {
            content: '';
            position: absolute;
            width: 8px;
            height: 8px;
            pointer-events: none;
            opacity: 0.7;
        }

        .hud-corners::before {
            top: -1px;
            left: -1px;
            border-top: 2px solid var(--cyan);
            border-left: 2px solid var(--cyan);
        }

        .hud-corners::after {
            bottom: -1px;
            right: -1px;
            border-bottom: 2px solid var(--pink);
            border-right: 2px solid var(--pink);
        }

        /* ---------- Header ---------- */
        header {
            padding: 14px 18px;
            border-bottom: 1px solid var(--panel-border);
            background: linear-gradient(180deg, rgba(255, 94, 168, 0.06), rgba(79, 209, 255, 0.03) 60%, transparent);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .brand-mark {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: conic-gradient(from 200deg, var(--pink), var(--cyan), var(--pink));
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            padding: 2px;
            box-shadow: 0 0 14px rgba(79, 209, 255, 0.45), 0 0 6px rgba(255, 94, 168, 0.3);
        }

        .brand-mark img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            display: block;
        }

        .brand-text h1 {
            font-size: 14px;
            letter-spacing: 4px;
            margin: 0;
            font-weight: 700;
            background: linear-gradient(90deg, var(--pink), var(--cyan));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 5px rgba(79, 209, 255, 0.35));
        }

        .status-line {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-top: 1px;
        }

        .status-line span:last-child {
            font-family: var(--mono);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #4fffa0;
            box-shadow: 0 0 8px #4fffa0, 0 0 2px #4fffa0;
            animation: pulse-dot 2s ease-in-out infinite;
            position: relative;
        }

        .status-dot::after {
            content: '';
            position: absolute;
            inset: -4px;
            border: 1px solid #4fffa0;
            border-radius: 50%;
            opacity: 0;
            animation: radar-ping 2s ease-out infinite;
        }

        @keyframes radar-ping {
            0% {
                opacity: 0.6;
                transform: scale(0.6);
            }

            100% {
                opacity: 0;
                transform: scale(2.2);
            }
        }

        @keyframes pulse-dot {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.35;
            }
        }

        .status-line span {
            font-size: 9px;
            letter-spacing: 1.5px;
            color: var(--dim);
            text-transform: uppercase;
        }

        .header-actions {
            display: flex;
            gap: 6px;
        }

        .icon-btn {
            background: var(--panel);
            border: 1px solid var(--panel-border);
            color: var(--dim);
            font-size: 11px;
            padding: 5px 11px;
            border-radius: 20px;
            cursor: pointer;
            transition: border-color 0.15s, color 0.15s;
        }

        .icon-btn:hover {
            color: var(--text);
            border-color: var(--cyan);
        }

        /* ---------- Messages ---------- */
        #messages {
            flex: 1 1 auto;
            overflow-y: auto;
            padding: 18px 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        #messages::-webkit-scrollbar {
            width: 8px;
        }

        #messages::-webkit-scrollbar-track {
            background: transparent;
        }

        #messages::-webkit-scrollbar-thumb {
            background: var(--panel-border);
            border-radius: 4px;
        }

        #messages::-webkit-scrollbar-thumb:hover {
            background: var(--dim);
        }

        /* ---------- Pantalla de bienvenida (chat vacío) ---------- */
        .welcome {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            gap: 14px;
        }

        .welcome .avatar-big {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: conic-gradient(from 200deg, var(--pink), var(--cyan), var(--pink));
            padding: 3px;
            box-shadow: 0 0 24px rgba(79, 209, 255, 0.35), 0 0 10px rgba(255, 94, 168, 0.25);
        }

        .welcome .avatar-big img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            display: block;
        }

        .welcome h2 {
            margin: 0;
            font-size: 15px;
            font-weight: 600;
            color: var(--text);
            letter-spacing: 0.5px;
        }

        .welcome p {
            margin: 0;
            font-size: 12px;
            color: var(--dim);
            max-width: 260px;
            line-height: 1.5;
        }

        .suggestions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-top: 4px;
        }

        .suggestion-chip {
            background: var(--panel);
            border: 1px solid var(--panel-border);
            color: var(--text);
            font-size: 12px;
            padding: 7px 13px;
            border-radius: 16px;
            cursor: pointer;
            transition: border-color 0.15s, transform 0.1s, box-shadow 0.15s;
        }

        .suggestion-chip:hover {
            border-color: var(--cyan);
            transform: translateY(-1px);
            box-shadow: 0 0 10px rgba(79, 209, 255, 0.25);
        }

        .msg-row {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            max-width: 88%;
        }

        .msg-row.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .msg-row.assistant {
            align-self: flex-start;
        }

        .avatar {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            flex-shrink: 0;
            background: conic-gradient(from 200deg, var(--pink), var(--cyan), var(--pink));
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2px;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            display: block;
        }

        .msg {
            padding: 10px 13px;
            border-radius: 14px;
            font-size: 13px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .msg-row.user .msg {
            background: linear-gradient(135deg, #1c4a5c, #24354f);
            color: var(--text);
            border-bottom-right-radius: 4px;
        }

        .msg-row.assistant .msg {
            background: var(--panel);
            border: 1px solid var(--panel-border);
            border-left: 2px solid var(--cyan);
            color: var(--text);
            border-bottom-left-radius: 4px;
        }

        .msg-row.assistant .msg {
            position: relative;
        }

        .copy-btn {
            position: absolute;
            top: -8px;
            right: -8px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--panel);
            border: 1px solid var(--panel-border);
            color: var(--dim);
            font-size: 11px;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .msg-row.assistant:hover .copy-btn {
            display: flex;
        }

        .copy-btn:hover {
            color: var(--cyan);
            border-color: var(--cyan);
        }

        .msg img {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 8px;
            display: block;
        }

        /* Indicador "pensando" */
        .thinking-dots {
            display: inline-flex;
            gap: 4px;
            padding: 3px 0;
        }

        .thinking-dots span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--cyan);
            animation: bounce-dot 1.1s ease-in-out infinite;
        }

        .thinking-dots span:nth-child(2) {
            animation-delay: 0.15s;
            background: #b78fd6;
        }

        .thinking-dots span:nth-child(3) {
            animation-delay: 0.3s;
            background: var(--pink);
        }

        @keyframes bounce-dot {

            0%,
            60%,
            100% {
                transform: translateY(0);
                opacity: 0.5;
            }

            30% {
                transform: translateY(-4px);
                opacity: 1;
            }
        }

        /* ---------- Tarjeta de confirmación ---------- */
        .confirm-card {
            align-self: flex-start;
            max-width: 88%;
            margin-left: 32px;
            background: var(--danger-bg);
            border: 1px solid var(--danger-border);
            border-radius: 12px;
            padding: 12px 13px;
            font-size: 13px;
        }

        .confirm-card .confirm-title {
            color: var(--danger);
            font-weight: 700;
            margin-bottom: 4px;
            font-size: 11px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-family: var(--mono);
        }

        .confirm-card .confirm-desc {
            color: var(--text);
            margin-bottom: 10px;
        }

        .confirm-buttons {
            display: flex;
            gap: 8px;
        }

        .confirm-buttons button {
            flex: 1;
            border: none;
            border-radius: 8px;
            padding: 7px 0;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        .confirm-yes {
            background: var(--danger);
            color: white;
        }

        .confirm-no {
            background: var(--panel);
            color: var(--text);
            border: 1px solid var(--panel-border) !important;
        }

        /* ---------- Input ---------- */
        #input-bar {
            flex-shrink: 0;
            display: flex;
            align-items: flex-end;
            gap: 8px;
            padding: 12px 14px 14px;
            border-top: 1px solid var(--panel-border);
        }

        #input {
            flex: 1;
            background: var(--panel);
            border: 1px solid var(--panel-border);
            color: var(--text);
            border-radius: 20px;
            padding: 10px 16px;
            font-size: 13px;
            font-family: inherit;
            resize: none;
            outline: none;
            transition: border-color 0.15s;
            max-height: 120px;
            overflow-y: auto;
            line-height: 1.4;
        }

        #input:focus {
            border-color: var(--cyan);
            box-shadow: 0 0 0 1px var(--cyan), 0 0 12px rgba(79, 209, 255, 0.25);
        }

        #send-btn {
            width: 38px;
            height: 38px;
            flex-shrink: 0;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--pink), var(--cyan));
            color: #0a0e14;
            border: none;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 0 12px rgba(79, 209, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s, opacity 0.15s;
        }

        #send-btn:hover:not(:disabled) {
            transform: scale(1.06);
        }

        #send-btn:disabled {
            opacity: 0.4;
            cursor: default;
            transform: none;
        }

        #mic-btn {
            width: 38px;
            height: 38px;
            flex-shrink: 0;
            border-radius: 50%;
            background: var(--panel);
            border: 1px solid var(--panel-border);
            color: var(--dim);
            font-size: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: border-color 0.15s, color 0.15s, background 0.15s;
        }

        #mic-btn:hover {
            border-color: var(--cyan);
            color: var(--cyan);
        }

        #mic-btn.recording {
            background: var(--danger);
            border-color: var(--danger);
            color: white;
            animation: mic-pulse 1.2s ease-in-out infinite;
        }

        @keyframes mic-pulse {

            0%,
            100% {
                box-shadow: 0 0 0 0 rgba(255, 95, 95, 0.5);
            }

            50% {
                box-shadow: 0 0 0 8px rgba(255, 95, 95, 0);
            }
        }

        #mic-btn:disabled {
            opacity: 0.4;
            cursor: default;
        }

        #song-btn {
            width: 38px;
            height: 38px;
            flex-shrink: 0;
            border-radius: 50%;
            background: var(--panel);
            border: 1px solid var(--panel-border);
            color: var(--dim);
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: border-color 0.15s, color 0.15s;
        }

        #song-btn:hover {
            border-color: var(--pink);
            color: var(--pink);
        }

        #song-btn.listening {
            background: var(--pink);
            border-color: var(--pink);
            color: white;
            animation: mic-pulse 1.2s ease-in-out infinite;
        }

        #song-btn:disabled {
            opacity: 0.4;
            cursor: default;
        }
    </style>
</head>

<body>
    <header>
        <div class="brand">
            <div class="brand-mark"><img class="avatar-img" src="../build/avatar.png" alt="ALYA" /></div>
            <div class="brand-text">
                <h1>ALYA</h1>
                <div class="status-line"><span class="status-dot"></span><span>En línea</span></div>
            </div>
        </div>
        <div class="header-actions">
            <button class="icon-btn" id="mute-btn">🔊 Voz</button>
            <button class="icon-btn" id="reset-btn">↻ Nueva</button>
        </div>
    </header>

    <div id="messages">
        <div class="welcome" id="welcome">
            <div class="avatar-big"><img class="avatar-img" src="../build/avatar.png" alt="ALYA" /></div>
            <h2>Hola, soy ALYA</h2>
            <p>Puedo abrir y cerrar apps, revisar tu sistema, buscar archivos, controlar la música, y generar imágenes.
                Pregúntame algo.</p>
            <div class="suggestions">
                <button class="suggestion-chip" data-msg="¿Cómo está mi PC ahora mismo?">¿Cómo está mi PC?</button>
                <button class="suggestion-chip" data-msg="Genera una imagen de un gato astronauta">Genera una
                    imagen</button>
                <button class="suggestion-chip" data-msg="¿Qué puedes hacer?">¿Qué puedes hacer?</button>
            </div>
        </div>
    </div>

    <div id="input-bar">
        <button id="mic-btn" title="Hablar (o Ctrl+Shift+1 desde cualquier lugar)">🎤</button>
        <button id="song-btn" title="¿Qué canción es esta? (escucha 8 segundos)">🎵</button>
        <textarea id="input" rows="1" placeholder="Escríbele a ALYA..."></textarea>
        <button id="send-btn" title="Enviar">➤</button>
    </div>

    <script>
        const messagesEl = document.getElementById('messages');
        const inputEl = document.getElementById('input');
        const sendBtn = document.getElementById('send-btn');
        const resetBtn = document.getElementById('reset-btn');

        // La ruta relativa "../build/avatar.png" solo funciona en modo
        // desarrollo — una vez empaquetada la app, main.ts nos da la ruta
        // real. Empezamos con la relativa (funciona hoy) y la actualizamos
        // apenas llega la de verdad (no se nota, es instantáneo).
        let avatarUrl = '../build/avatar.png';
        window.alya.getAvatarUrl().then((url) => {
            avatarUrl = url;
            document.querySelectorAll('.avatar-img').forEach((img) => (img.src = avatarUrl));
        });

        function removeWelcome() {
            const welcome = document.getElementById('welcome');
            if (welcome) welcome.remove();
        }

        function addMessage(role, text, imageUrl) {
            removeWelcome();
            const row = document.createElement('div');
            row.className = `msg-row ${role}`;

            if (role === 'assistant') {
                const avatar = document.createElement('div');
                avatar.className = 'avatar';
                avatar.innerHTML = `<img class="avatar-img" src="${avatarUrl}" alt="ALYA" />`;
                row.appendChild(avatar);
            }

            const bubble = document.createElement('div');
            bubble.className = 'msg';
            bubble.textContent = text;

            if (role === 'assistant' && text) {
                const copyBtn = document.createElement('button');
                copyBtn.className = 'copy-btn';
                copyBtn.title = 'Copiar';
                copyBtn.textContent = '⧉';
                copyBtn.addEventListener('click', () => {
                    navigator.clipboard.writeText(text);
                    copyBtn.textContent = '✓';
                    setTimeout(() => (copyBtn.textContent = '⧉'), 1200);
                });
                bubble.appendChild(copyBtn);
            }

            if (imageUrl) {
                const img = document.createElement('img');
                img.src = imageUrl;
                bubble.appendChild(img);
            }
            row.appendChild(bubble);

            messagesEl.appendChild(row);
            messagesEl.scrollTop = messagesEl.scrollHeight;
            return row;
        }

        function addThinking() {
            removeWelcome();
            const row = document.createElement('div');
            row.className = 'msg-row assistant';
            row.innerHTML = `
        <div class="avatar"><img class="avatar-img" src="${avatarUrl}" alt="ALYA" /></div>
        <div class="msg"><div class="thinking-dots"><span></span><span></span><span></span></div></div>
      `;
            messagesEl.appendChild(row);
            messagesEl.scrollTop = messagesEl.scrollHeight;
            return row;
        }

        function addConfirmCard(pending) {
            const card = document.createElement('div');
            card.className = 'confirm-card hud-corners';

            const title = document.createElement('div');
            title.className = 'confirm-title';
            title.textContent = '⚠ Confirmación necesaria';
            card.appendChild(title);

            const desc = document.createElement('div');
            desc.className = 'confirm-desc';
            desc.textContent = pending.description;
            card.appendChild(desc);

            const buttonsRow = document.createElement('div');
            buttonsRow.className = 'confirm-buttons';

            const yesBtn = document.createElement('button');
            yesBtn.className = 'confirm-yes';
            yesBtn.textContent = 'Sí, hazlo';

            const noBtn = document.createElement('button');
            noBtn.className = 'confirm-no';
            noBtn.textContent = 'No, cancelar';

            const disableButtons = () => {
                yesBtn.disabled = true;
                noBtn.disabled = true;
            };

            yesBtn.addEventListener('click', async () => {
                disableButtons();
                const reply = await window.alya.confirmAction();
                card.remove();
                addMessage('assistant', reply.text);
            });

            noBtn.addEventListener('click', async () => {
                disableButtons();
                const reply = await window.alya.cancelAction();
                card.remove();
                addMessage('assistant', reply.text);
            });

            buttonsRow.appendChild(yesBtn);
            buttonsRow.appendChild(noBtn);
            card.appendChild(buttonsRow);

            messagesEl.appendChild(card);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        async function send() {
            const text = inputEl.value.trim();
            if (!text) return;

            addMessage('user', text);
            inputEl.value = '';
            inputEl.style.height = 'auto';
            sendBtn.disabled = true;

            const thinkingRow = addThinking();

            try {
                const reply = await window.alya.sendChatMessage(text);
                thinkingRow.remove();
                addMessage('assistant', reply.text, reply.imageUrl);
                if (reply.pendingConfirmation) {
                    addConfirmCard(reply.pendingConfirmation);
                }
            } catch (err) {
                thinkingRow.remove();
                addMessage('assistant', 'Algo falló al conectar con ALYA: ' + err.message);
            }

            sendBtn.disabled = false;
            inputEl.focus();
        }

        sendBtn.addEventListener('click', send);
        inputEl.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                send();
            }
        });

        // El input crece con el texto (hasta un máximo, después scrollea)
        inputEl.addEventListener('input', () => {
            inputEl.style.height = 'auto';
            inputEl.style.height = inputEl.scrollHeight + 'px';
        });

        // Sugerencias de la pantalla de bienvenida
        document.querySelectorAll('.suggestion-chip').forEach((chip) => {
            chip.addEventListener('click', () => {
                inputEl.value = chip.dataset.msg;
                send();
            });
        });

        resetBtn.addEventListener('click', async () => {
            await window.alya.resetChat();
            messagesEl.innerHTML = '';
            addMessage('assistant', 'Conversación reiniciada. ¿En qué te ayudo?');
        });

        const muteBtn = document.getElementById('mute-btn');
        muteBtn.addEventListener('click', async () => {
            const muted = await window.alya.toggleMute();
            muteBtn.textContent = muted ? '🔇 Muda' : '🔊 Voz';
        });

        // ---------- Control por voz (micrófono) ----------
        const micBtn = document.getElementById('mic-btn');
        let mediaRecorder = null;
        let audioChunks = [];
        let isRecording = false;

        function blobToBase64(blob) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onloadend = () => {
                    // reader.result es algo como "data:audio/webm;codecs=opus;base64,AAAA..."
                    // solo nos interesa la parte después de la coma.
                    const base64 = reader.result.split(',')[1];
                    resolve(base64);
                };
                reader.onerror = reject;
                reader.readAsDataURL(blob);
            });
        }

        /**
         * Combina el micrófono con el audio del sistema (lo que suena por tus
         * parlantes/audífonos — incluye llamadas de Discord, videos, etc.) en
         * una sola grabación mezclada. Si el audio del sistema no se puede
         * capturar por alguna razón, sigue funcionando solo con el micrófono
         * (no rompe el control por voz por esto).
         */
        async function getMixedRecordingStream() {
            const micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            const tracksToStopOnEnd = [...micStream.getTracks()];

            let systemStream = null;
            try {
                const rawSystemStream = await navigator.mediaDevices.getDisplayMedia({
                    video: { width: 1, height: 1 },
                    audio: true,
                });
                rawSystemStream.getVideoTracks().forEach((track) => {
                    track.stop();
                    rawSystemStream.removeTrack(track);
                });
                if (rawSystemStream.getAudioTracks().length > 0) {
                    systemStream = rawSystemStream;
                    tracksToStopOnEnd.push(...systemStream.getTracks());
                }
            } catch (err) {
                // No se pudo capturar el audio del sistema (ej. nada sonando, o
                // el usuario canceló el permiso) — seguimos solo con el micrófono.
                console.warn('No se pudo capturar audio del sistema, solo micrófono:', err.message);
            }

            if (!systemStream) {
                return { stream: micStream, tracksToStopOnEnd };
            }

            // Mezclamos ambas fuentes en una sola pista de audio usando el
            // Web Audio API — así el .wav final tiene tu voz Y lo que suena
            // por el sistema, todo junto.
            const audioContext = new AudioContext();
            const destination = audioContext.createMediaStreamDestination();

            audioContext.createMediaStreamSource(micStream).connect(destination);
            audioContext.createMediaStreamSource(systemStream).connect(destination);

            return { stream: destination.stream, tracksToStopOnEnd };
        }

        async function startRecording() {
            try {
                const { stream, tracksToStopOnEnd } = await getMixedRecordingStream();
                audioChunks = [];
                mediaRecorder = new MediaRecorder(stream);

                mediaRecorder.addEventListener('dataavailable', (e) => {
                    if (e.data.size > 0) audioChunks.push(e.data);
                });

                mediaRecorder.addEventListener('stop', async () => {
                    // Soltamos el micrófono y el audio del sistema (apaga los
                    // íconos de "en uso" del SO).
                    tracksToStopOnEnd.forEach((track) => track.stop());

                    if (audioChunks.length === 0) return;

                    const blob = new Blob(audioChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
                    const base64 = await blobToBase64(blob);

                    removeWelcome();
                    const thinkingRow = addThinking();
                    micBtn.disabled = true;
                    sendBtn.disabled = true;

                    try {
                        const { transcript, reply } = await window.alya.sendVoiceMessage(
                            base64,
                            mediaRecorder.mimeType || 'audio/webm'
                        );
                        thinkingRow.remove();
                        if (transcript) addMessage('user', transcript);
                        addMessage('assistant', reply.text, reply.imageUrl);
                        if (reply.pendingConfirmation) addConfirmCard(reply.pendingConfirmation);
                    } catch (err) {
                        thinkingRow.remove();
                        addMessage('assistant', 'No pude procesar el audio: ' + err.message);
                    }

                    micBtn.disabled = false;
                    sendBtn.disabled = false;
                });

                mediaRecorder.start();
                isRecording = true;
                micBtn.classList.add('recording');
                micBtn.textContent = '⏹';
            } catch (err) {
                addMessage(
                    'assistant',
                    'No pude acceder al micrófono. Revisa que Windows le dé permiso a ALYA en ' +
                    'Configuración → Privacidad → Micrófono.'
                );
            }
        }

        function stopRecording() {
            if (mediaRecorder && isRecording) {
                mediaRecorder.stop();
                isRecording = false;
                micBtn.classList.remove('recording');
                micBtn.textContent = '🎤';
            }
        }

        micBtn.addEventListener('click', () => {
            if (isRecording) {
                stopRecording();
            } else {
                startRecording();
            }
        });

        // Atajo global (Ctrl+Shift+1 por defecto): interruptor — si no está
        // grabando, arranca; si ya está grabando, detiene y manda el audio.
        window.alya.onTriggerVoice(() => {
            if (isRecording) {
                stopRecording();
            } else {
                startRecording();
            }
        });

        // ---------- Identificar canción (tipo Shazam) ----------
        const songBtn = document.getElementById('song-btn');
        const SONG_LISTEN_SECONDS = 8;

        songBtn.addEventListener('click', async () => {
            songBtn.disabled = true;
            micBtn.disabled = true;
            songBtn.classList.add('listening');
            const originalTitle = songBtn.title;
            songBtn.title = `Escuchando... (${SONG_LISTEN_SECONDS}s)`;

            try {
                // Audio DEL SISTEMA (lo que suena en tu PC), no el micrófono —
                // mucho más confiable para identificar canciones. getDisplayMedia
                // exige pedir video, así que lo pedimos mínimo y lo descartamos
                // enseguida, quedándonos solo con el audio.
                const rawStream = await navigator.mediaDevices.getDisplayMedia({
                    video: { width: 1, height: 1 },
                    audio: true,
                });

                rawStream.getVideoTracks().forEach((track) => {
                    track.stop();
                    rawStream.removeTrack(track);
                });

                if (rawStream.getAudioTracks().length === 0) {
                    throw new Error(
                        'No se pudo capturar el audio del sistema (revisa que algo esté sonando).'
                    );
                }

                const stream = rawStream;
                const chunks = [];
                const recorder = new MediaRecorder(stream);

                recorder.addEventListener('dataavailable', (e) => {
                    if (e.data.size > 0) chunks.push(e.data);
                });

                const finished = new Promise((resolve) => {
                    recorder.addEventListener('stop', () => {
                        stream.getTracks().forEach((track) => track.stop());
                        resolve(new Blob(chunks, { type: recorder.mimeType || 'audio/webm' }));
                    });
                });

                recorder.start();
                await new Promise((r) => setTimeout(r, SONG_LISTEN_SECONDS * 1000));
                recorder.stop();

                const blob = await finished;
                const base64 = await blobToBase64(blob);

                removeWelcome();
                const thinkingRow = addThinking();

                const reply = await window.alya.identifySong(base64, recorder.mimeType || 'audio/webm');
                thinkingRow.remove();
                addMessage('assistant', reply.text);
            } catch (err) {
                addMessage('assistant', 'No pude escuchar para identificar la canción: ' + err.message);
            }

            songBtn.disabled = false;
            micBtn.disabled = false;
            songBtn.classList.remove('listening');
            songBtn.title = originalTitle;
        });

        inputEl.focus();
    </script>
</body>
