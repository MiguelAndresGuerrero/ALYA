<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <title>ALYA</title>
    <style>
        /* ============================================================
           ALYA — ventana principal
           Regla de color: negro ~70%, azul ~15%, morado ~10%, y el
           cian/magenta solo como acento. El color "de estado" (--state)
           cambia según lo que ALYA esté haciendo; lo usan el avatar, el
           punto de estado y el brillo del compositor.
           ============================================================ */
        :root {
            --bg: #070B12;
            --panel: #0B111A;
            --panel-2: #101824;
            --panel-3: #162031;
            --line: rgba(130, 170, 220, 0.09);
            --line-strong: rgba(130, 170, 220, 0.17);

            --blue: #39C6FF;
            --cyan: #63E6FF;
            --violet: #8B5CFF;
            --magenta: #D85CFF;

            --text: #EAF2FF;
            --dim: #718096;
            --dim-2: #4B5A70;

            --ok: #4ADE80;
            --warn: #FBBF24;
            --danger: #FF6B6B;

            --state: var(--blue);
            --state-2: var(--violet);

            --sidebar-w: 252px;

            /* Fondo de nebulosa. En desarrollo sale de esta ruta relativa;
               ya instalada, main.ts manda la ruta real y se reemplaza. */
            --backdrop-image: url('../build/background.jpg');
            --sans: 'Segoe UI', system-ui, -apple-system, sans-serif;
            --mono: 'Cascadia Code', 'Consolas', 'Courier New', monospace;
        }

        body[data-state="listening"] {
            --state: var(--cyan);
            --state-2: var(--blue);
        }

        body[data-state="thinking"] {
            --state: var(--violet);
            --state-2: var(--magenta);
        }

        body[data-state="speaking"] {
            --state: var(--blue);
            --state-2: var(--cyan);
        }

        body[data-state="error"] {
            --state: var(--danger);
            --state-2: #FF9F6B;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            margin: 0;
        }

        body {
            display: flex;
            flex-direction: column;
            background: var(--bg);
            color: var(--text);
            font-family: var(--sans);
            font-size: 13px;
            overflow: hidden;
        }

        button {
            font-family: inherit;
            color: inherit;
        }

        /* ---------- Fondo ---------- */
        /* La imagen ocupa toda la ventana; encima va un velo que oscurece
           los bordes (para que la cabecera y el compositor se lean bien) y
           que se cierra un poco más cuando hay conversación, así el texto
           de los mensajes nunca compite con las nubes. */
        .backdrop {
            position: fixed;
            inset: 0;
            z-index: 0;
            background: var(--bg) var(--backdrop-image) center / cover no-repeat;
        }

        .backdrop::after {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse 90% 80% at 50% 44%, transparent 35%, rgba(4, 7, 12, 0.55) 100%),
                linear-gradient(180deg, rgba(4, 7, 12, 0.35), transparent 22%, transparent 68%, rgba(4, 7, 12, 0.6));
            transition: background-color 0.4s;
        }

        body.in-chat .backdrop::after {
            background-color: rgba(4, 7, 12, 0.42);
        }

        svg.ic {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(130, 170, 220, 0.14);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(130, 170, 220, 0.26);
        }

        /* ---------- Núcleo de ALYA (avatar + anillo de estado) ---------- */
        .core {
            --size: 36px;
            --ring: 2px;
            --gap: 3px;
            position: relative;
            width: var(--size);
            height: var(--size);
            border-radius: 50%;
            flex-shrink: 0;
        }

        .core-lg {
            --size: 132px;
            --ring: 3px;
            --gap: 7px;
        }

        .core-md {
            --size: 72px;
            --ring: 2px;
            --gap: 5px;
        }

        .core-img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            display: block;
            background: var(--panel-2);
        }

        /* Anillo: un degradado cónico recortado en forma de aro, que gira. */
        .core-ring {
            position: absolute;
            inset: calc((var(--ring) + var(--gap)) * -1);
            border-radius: 50%;
            background: conic-gradient(from 0deg,
                    var(--state), transparent 26%, var(--state-2) 50%, transparent 76%, var(--state));
            -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - var(--ring) - 0.5px), #000 calc(100% - var(--ring)));
            mask: radial-gradient(farthest-side, transparent calc(100% - var(--ring) - 0.5px), #000 calc(100% - var(--ring)));
            animation: core-spin 16s linear infinite;
            transition: opacity 0.3s;
        }

        /* Resplandor suave que "respira". */
        .core-glow {
            position: absolute;
            inset: calc(var(--gap) * -1);
            border-radius: 50%;
            box-shadow: 0 0 calc(var(--size) * 0.28) color-mix(in srgb, var(--state) 38%, transparent);
            animation: core-breathe 5s ease-in-out infinite;
            transition: box-shadow 0.4s;
        }

        /* Ondas: solo se ven al escuchar y al hablar. */
        .core-wave {
            position: absolute;
            inset: calc((var(--ring) + var(--gap)) * -1);
            border-radius: 50%;
            border: 1.5px solid var(--state);
            opacity: 0;
            pointer-events: none;
        }

        body[data-state="listening"] .core-wave {
            animation: core-wave 1.9s ease-out infinite;
        }

        body[data-state="speaking"] .core-wave {
            animation: core-wave 1.15s ease-out infinite;
        }

        .core-wave:nth-of-type(2) {
            animation-delay: 0.45s !important;
        }

        .core-wave:nth-of-type(3) {
            animation-delay: 0.9s !important;
        }

        body[data-state="thinking"] .core-ring {
            animation-duration: 2.4s;
        }

        body[data-state="thinking"] .core-glow {
            animation: core-pulse 1.5s ease-in-out infinite;
        }

        body[data-state="speaking"] .core-ring {
            animation-duration: 7s;
        }

        body[data-state="speaking"] .core-glow {
            animation: core-pulse 0.55s ease-in-out infinite;
        }

        body[data-state="error"] .core-ring {
            animation-duration: 30s;
        }

        @keyframes core-spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes core-breathe {

            0%,
            100% {
                opacity: 0.55;
            }

            50% {
                opacity: 1;
            }
        }

        @keyframes core-pulse {

            0%,
            100% {
                opacity: 0.45;
                transform: scale(0.97);
            }

            50% {
                opacity: 1;
                transform: scale(1.04);
            }
        }

        @keyframes core-wave {
            0% {
                opacity: 0.55;
                transform: scale(1);
            }

            100% {
                opacity: 0;
                transform: scale(1.55);
            }
        }

        @media (prefers-reduced-motion: reduce) {

            .core-ring,
            .core-glow,
            .core-wave {
                animation: none !important;
            }
        }

        /* ---------- Cabecera ---------- */
        .topbar {
            flex-shrink: 0;
            height: 58px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 14px 0 10px;
            background: rgba(8, 12, 20, 0.58);
            -webkit-backdrop-filter: blur(18px) saturate(1.25);
            backdrop-filter: blur(18px) saturate(1.25);
            border-bottom: 1px solid var(--line);
            position: relative;
            z-index: 30;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 13px;
            margin-left: 6px;
            min-width: 0;
        }

        .wordmark {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 4px;
            background: linear-gradient(90deg, var(--text), var(--cyan) 140%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 2px;
            font-size: 11px;
            color: var(--dim);
            white-space: nowrap;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--state);
            box-shadow: 0 0 8px var(--state);
            transition: background 0.3s, box-shadow 0.3s;
        }

        body[data-state="idle"] .status-dot {
            background: var(--ok);
            box-shadow: 0 0 8px var(--ok);
        }

        body:not([data-state="idle"]) #status-text {
            color: var(--state);
        }

        .top-actions {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .icon-btn,
        .pill-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            height: 32px;
            border-radius: 9px;
            border: 1px solid transparent;
            background: transparent;
            color: var(--dim);
            font-size: 12px;
            cursor: pointer;
            transition: background 0.15s, color 0.15s, border-color 0.15s;
        }

        .icon-btn {
            width: 32px;
        }

        .pill-btn {
            padding: 0 11px;
            border-color: var(--line);
        }

        .icon-btn:hover,
        .pill-btn:hover {
            background: var(--panel-2);
            color: var(--text);
            border-color: var(--line-strong);
        }

        /* (display: inline-flex le ganaría al atributo hidden) */
        .pill-btn[hidden] {
            display: none;
        }

        /* "Callar": solo aparece mientras ALYA está hablando. */
        .pill-btn.stop-speak {
            color: var(--state);
            border-color: color-mix(in srgb, var(--state) 45%, transparent);
            background: color-mix(in srgb, var(--state) 10%, transparent);
        }

        .pill-btn.stop-speak:hover {
            color: var(--text);
            border-color: color-mix(in srgb, var(--state) 75%, transparent);
            background: color-mix(in srgb, var(--state) 20%, transparent);
        }

        /* Voz silenciada: se tiene que notar de un vistazo. */
        .pill-btn.muted,
        .pill-btn.muted:hover {
            color: var(--warn);
            border-color: rgba(251, 191, 36, 0.45);
            background: rgba(251, 191, 36, 0.1);
        }

        .pill-btn.muted:hover {
            border-color: rgba(251, 191, 36, 0.7);
            background: rgba(251, 191, 36, 0.17);
        }

        /* Menú ⋯ */
        .menu-wrap {
            position: relative;
        }

        .menu {
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            width: 216px;
            padding: 6px;
            background: var(--panel-2);
            border: 1px solid var(--line-strong);
            border-radius: 12px;
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.55);
            z-index: 60;
        }

        .menu[hidden] {
            display: none;
        }

        .menu button {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 10px;
            border: none;
            border-radius: 8px;
            background: transparent;
            color: var(--text);
            font-size: 12.5px;
            text-align: left;
            cursor: pointer;
        }

        .menu button svg {
            color: var(--dim);
        }

        .menu button:hover {
            background: var(--panel-3);
        }

        .menu button.danger:hover {
            color: var(--danger);
        }

        .menu button.danger:hover svg {
            color: var(--danger);
        }

        .menu hr {
            border: none;
            border-top: 1px solid var(--line);
            margin: 5px 4px;
        }

        /* ---------- Cuerpo: barra lateral + escenario ---------- */
        .app {
            flex: 1;
            min-height: 0;
            display: flex;
            position: relative;
            z-index: 1;
        }

        .sidebar {
            width: var(--sidebar-w);
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            background: rgba(8, 12, 20, 0.66);
            -webkit-backdrop-filter: blur(20px) saturate(1.2);
            backdrop-filter: blur(20px) saturate(1.2);
            border-right: 1px solid var(--line);
            margin-left: calc(var(--sidebar-w) * -1);
            transition: margin-left 0.22s ease;
            z-index: 20;
        }

        body.sidebar-open .sidebar {
            margin-left: 0;
        }

        .side-top {
            padding: 14px 12px 10px;
        }

        .new-conv {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 9px 12px;
            border-radius: 10px;
            border: 1px solid var(--line-strong);
            background: linear-gradient(135deg, rgba(57, 198, 255, 0.10), rgba(139, 92, 255, 0.10));
            color: var(--text);
            font-size: 12.5px;
            font-weight: 600;
            cursor: pointer;
            transition: border-color 0.15s, background 0.15s;
        }

        .new-conv:hover {
            border-color: color-mix(in srgb, var(--blue) 55%, transparent);
            background: linear-gradient(135deg, rgba(57, 198, 255, 0.16), rgba(139, 92, 255, 0.16));
        }

        .new-conv svg {
            color: var(--blue);
        }

        .seg {
            display: flex;
            gap: 2px;
            margin-top: 10px;
            padding: 3px;
            border-radius: 9px;
            background: rgba(4, 7, 12, 0.5);
            border: 1px solid var(--line);
        }

        .seg button {
            flex: 1;
            padding: 5px 0;
            border: none;
            border-radius: 6px;
            background: transparent;
            color: var(--dim);
            font-size: 11.5px;
            cursor: pointer;
        }

        .seg button.active {
            background: var(--panel-3);
            color: var(--text);
        }

        .conv-list {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 2px 8px 10px;
        }

        .conv-group {
            margin: 12px 6px 5px;
            font-family: var(--mono);
            font-size: 9.5px;
            letter-spacing: 1.4px;
            text-transform: uppercase;
            color: var(--dim-2);
        }

        .conv-item {
            position: relative;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 7px 8px 7px 10px;
            border-radius: 8px;
            color: #B6C2D6;
            font-size: 12.5px;
            cursor: pointer;
            border: 1px solid transparent;
        }

        .conv-item:hover {
            background: var(--panel-2);
            color: var(--text);
        }

        .conv-item.active {
            background: var(--panel-2);
            color: var(--text);
            border-color: var(--line-strong);
        }

        .conv-item.active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 8px;
            bottom: 8px;
            width: 2px;
            border-radius: 2px;
            background: var(--blue);
        }

        .conv-title {
            flex: 1;
            min-width: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .conv-actions {
            display: none;
            gap: 1px;
        }

        .conv-item:hover .conv-actions,
        .conv-item .conv-actions.keep {
            display: flex;
        }

        .conv-actions button {
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            border-radius: 6px;
            background: transparent;
            color: var(--dim);
            cursor: pointer;
        }

        .conv-actions button svg {
            width: 13px;
            height: 13px;
        }

        .conv-actions button:hover {
            background: var(--panel-3);
            color: var(--text);
        }

        .conv-actions button.on {
            color: var(--warn);
        }

        .conv-actions button.on svg {
            fill: currentColor;
        }

        .conv-actions button.confirm {
            width: auto;
            padding: 0 7px;
            font-size: 10.5px;
            color: var(--danger);
            background: rgba(255, 107, 107, 0.12);
        }

        .conv-fav-mark {
            color: var(--warn);
            display: flex;
        }

        .conv-fav-mark svg {
            width: 11px;
            height: 11px;
            fill: currentColor;
        }

        .conv-item:hover .conv-fav-mark {
            display: none;
        }

        .conv-empty {
            margin: 22px 10px;
            color: var(--dim-2);
            font-size: 12px;
            line-height: 1.5;
            text-align: center;
        }

        .side-footer {
            flex-shrink: 0;
            padding: 8px;
            border-top: 1px solid var(--line);
        }

        .side-footer button {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 10px;
            border: none;
            border-radius: 8px;
            background: transparent;
            color: var(--dim);
            font-size: 12.5px;
            text-align: left;
            cursor: pointer;
        }

        .side-footer button:hover {
            background: var(--panel-2);
            color: var(--text);
        }

        /* En ventanas angostas la barra lateral flota por encima del chat. */
        .scrim {
            display: none;
        }

        @media (max-width: 760px) {
            .sidebar {
                position: absolute;
                top: 0;
                bottom: 0;
                left: 0;
                box-shadow: 18px 0 40px rgba(0, 0, 0, 0.5);
            }

            body.sidebar-open .scrim {
                display: block;
                position: absolute;
                inset: 0;
                background: rgba(4, 7, 12, 0.6);
                z-index: 15;
            }

            .pill-btn span {
                display: none;
            }

            .pill-btn {
                width: 32px;
                padding: 0;
            }
        }

        /* ---------- Escenario (chat) ---------- */
        .stage {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Grid ambiental: fino, casi negro, y se desvanece hacia los bordes. */
        .stage::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                linear-gradient(rgba(150, 190, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(150, 190, 255, 0.03) 1px, transparent 1px);
            background-size: 32px 32px;
            -webkit-mask: radial-gradient(ellipse 75% 70% at 50% 38%, #000 0%, transparent 100%);
            mask: radial-gradient(ellipse 75% 70% at 50% 38%, #000 0%, transparent 100%);
            pointer-events: none;
        }

        #messages {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            position: relative;
        }

        .thread {
            max-width: 800px;
            min-height: 100%;
            margin: 0 auto;
            padding: 22px 22px 10px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* ---------- Pantalla inicial ---------- */
        .welcome {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 10px 0 18px;
            position: relative;
        }

        .welcome-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 460px;
            height: 380px;
            transform: translate(-50%, -66%);
            background: radial-gradient(closest-side, color-mix(in srgb, var(--state) 13%, transparent), transparent 72%);
            pointer-events: none;
            transition: background 0.5s;
        }

        .welcome .core {
            margin-bottom: 26px;
        }

        /* Adorno tipo HUD alrededor del avatar: líneas y nodos muy tenues
           que toman el color del estado. Es decorativo, no dice nada. */
        .core-hud {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 440px;
            height: 160px;
            transform: translate(-50%, -50%);
            color: var(--state);
            opacity: 0.5;
            pointer-events: none;
            transition: color 0.4s;
        }

        .core-hud .hud-line {
            fill: none;
            stroke: currentColor;
            stroke-width: 1;
            opacity: 0.55;
        }

        .core-hud .hud-node {
            fill: rgba(7, 11, 18, 0.55);
            stroke: currentColor;
            stroke-width: 1;
            opacity: 0.8;
        }

        .core-hud .hud-dot {
            fill: currentColor;
        }

        .core-hud .hud-text {
            fill: currentColor;
            opacity: 0.38;
        }

        .core-hud .hud-glyph {
            fill: none;
            stroke: currentColor;
            stroke-width: 1;
            opacity: 0.9;
        }

        .welcome h2 {
            margin: 0;
            font-size: 22px;
            font-weight: 600;
            letter-spacing: 0.2px;
            position: relative;
        }

        .welcome-sub {
            margin: 6px 0 0;
            color: var(--dim);
            font-size: 13px;
            position: relative;
        }

        .quick-label {
            margin: 26px 0 10px;
            font-family: var(--mono);
            font-size: 10px;
            letter-spacing: 1.6px;
            text-transform: uppercase;
            color: var(--dim-2);
            position: relative;
        }

        .quick-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 208px));
            gap: 10px;
            position: relative;
        }

        .quick-card {
            display: flex;
            align-items: center;
            gap: 11px;
            padding: 11px 13px;
            border-radius: 12px;
            --tint: var(--blue);
            border: 1px solid rgba(190, 215, 255, 0.10);
            background:
                linear-gradient(115deg, color-mix(in srgb, var(--tint) 17%, transparent), transparent 62%),
                rgba(12, 18, 30, 0.52);
            -webkit-backdrop-filter: blur(14px) saturate(1.3);
            backdrop-filter: blur(14px) saturate(1.3);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
            text-align: left;
            cursor: pointer;
            transition: border-color 0.15s, transform 0.15s, box-shadow 0.15s;
        }

        .quick-card:nth-child(2) {
            --tint: var(--magenta);
        }

        .quick-card:nth-child(3) {
            --tint: var(--cyan);
        }

        .quick-card:nth-child(4) {
            --tint: var(--violet);
        }

        .quick-card:hover {
            border-color: color-mix(in srgb, var(--tint) 55%, transparent);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06), 0 6px 22px color-mix(in srgb, var(--tint) 14%, transparent);
            transform: translateY(-1px);
        }

        .quick-icon {
            width: 32px;
            height: 32px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 9px;
            color: var(--blue);
            background: rgba(57, 198, 255, 0.09);
        }

        .quick-card:nth-child(2) .quick-icon {
            color: var(--magenta);
            background: rgba(216, 92, 255, 0.09);
        }

        .quick-card:nth-child(3) .quick-icon {
            color: var(--cyan);
            background: rgba(99, 230, 255, 0.08);
        }

        .quick-card:nth-child(4) .quick-icon {
            color: var(--violet);
            background: rgba(139, 92, 255, 0.12);
        }

        .quick-text {
            min-width: 0;
        }

        .quick-text b {
            display: block;
            font-size: 12.5px;
            font-weight: 600;
            color: var(--text);
        }

        .quick-text small {
            display: block;
            margin-top: 2px;
            font-size: 11px;
            color: var(--dim);
        }

        /* Ventana angosta o baja: todo un poco más compacto para que la
           pantalla inicial entre sin tener que desplazarse. */
        @media (max-width: 560px), (max-height: 620px) {
            .core-lg {
                --size: 100px;
            }

            .welcome .core {
                margin-bottom: 20px;
            }

            .core-hud {
                display: none;
            }

            .welcome h2 {
                font-size: 19px;
            }

            .quick-label {
                margin-top: 18px;
            }

            .quick-grid {
                width: 100%;
                max-width: 440px;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 8px;
            }

            .quick-card {
                padding: 9px 10px;
                gap: 9px;
            }

            .thread {
                padding: 16px 14px 8px;
            }

            .composer-wrap {
                padding: 6px 14px 12px;
            }

            .msg-row {
                max-width: 94%;
            }
        }

        @media (max-width: 380px) {
            .quick-grid {
                grid-template-columns: minmax(0, 1fr);
            }
        }

        /* ---------- Mensajes ---------- */
        .msg-row {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            max-width: 86%;
        }

        .msg-row.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .msg-row.assistant {
            align-self: flex-start;
        }

        .msg-avatar {
            width: 28px;
            height: 28px;
            margin-top: 2px;
            border-radius: 50%;
            flex-shrink: 0;
            padding: 1.5px;
            background: linear-gradient(140deg, var(--blue), var(--violet));
        }

        .msg-avatar img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            display: block;
            background: var(--panel);
        }

        .msg-body {
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .msg {
            position: relative;
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 13.5px;
            line-height: 1.55;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        /* Las burbujas son casi opacas a propósito: el fondo se intuye,
           pero el texto se lee igual que sobre un panel liso. */
        .msg-row.user .msg {
            background:
                linear-gradient(135deg, rgba(57, 198, 255, 0.17), rgba(139, 92, 255, 0.22)),
                rgba(12, 18, 30, 0.84);
            border: 1px solid rgba(120, 175, 255, 0.24);
            border-top-right-radius: 5px;
        }

        .msg-row.assistant .msg {
            background: rgba(14, 21, 33, 0.90);
            border: 1px solid rgba(150, 185, 235, 0.12);
            border-top-left-radius: 5px;
        }

        /* Respuesta que todavía se está escribiendo: cursor al final. */
        .msg.live::after {
            content: '';
            display: inline-block;
            width: 7px;
            height: 1.05em;
            margin-left: 3px;
            vertical-align: -0.18em;
            border-radius: 2px;
            background: var(--state);
            animation: caret-blink 1s steps(2, jump-none) infinite;
        }

        @keyframes caret-blink {
            50% {
                opacity: 0.15;
            }
        }

        .copy-btn {
            position: absolute;
            top: -9px;
            right: -9px;
            width: 24px;
            height: 24px;
            border-radius: 7px;
            background: var(--panel-3);
            border: 1px solid var(--line-strong);
            color: var(--dim);
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .copy-btn svg {
            width: 12px;
            height: 12px;
        }

        .msg-row.assistant .msg:hover .copy-btn {
            display: flex;
        }

        .copy-btn:hover {
            color: var(--cyan);
            border-color: var(--cyan);
        }

        .msg img {
            max-width: 100%;
            border-radius: 9px;
            margin-top: 8px;
            display: block;
        }

        .msg .user-images {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .msg .user-images img {
            max-width: 150px;
            max-height: 150px;
            margin-top: 0;
            object-fit: cover;
        }

        .msg .user-images+.user-text {
            margin-top: 8px;
        }

        /* Marca de "acá había imágenes adjuntas" al reabrir una conversación */
        .image-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 3px 8px;
            border-radius: 7px;
            background: rgba(255, 255, 255, 0.06);
            color: var(--dim);
            font-size: 11.5px;
        }

        .image-chip+.user-text {
            margin-top: 7px;
        }

        .image-chip svg {
            width: 13px;
            height: 13px;
        }

        .thinking-dots {
            display: flex;
            gap: 5px;
            padding: 5px 2px;
        }

        .thinking-dots span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--violet);
            animation: dot-bounce 1.2s infinite ease-in-out;
        }

        .thinking-dots span:nth-child(2) {
            animation-delay: 0.15s;
        }

        .thinking-dots span:nth-child(3) {
            animation-delay: 0.3s;
        }

        @keyframes dot-bounce {

            0%,
            80%,
            100% {
                transform: translateY(0);
                opacity: 0.35;
            }

            40% {
                transform: translateY(-4px);
                opacity: 1;
            }
        }

        /* ---------- Tarjetas inteligentes ---------- */
        .card {
            width: min(380px, 100%);
            padding: 13px 15px 14px;
            border-radius: 13px;
            background: linear-gradient(180deg, rgba(16, 24, 36, 0.93), rgba(11, 17, 26, 0.93));
            border: 1px solid var(--line-strong);
        }

        .card-head {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 11px;
            font-family: var(--mono);
            font-size: 10px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--dim);
        }

        .card-head svg {
            width: 14px;
            height: 14px;
            color: var(--blue);
        }

        .card-head .count {
            margin-left: auto;
            letter-spacing: 0.5px;
            color: var(--dim-2);
        }

        .meter {
            display: grid;
            grid-template-columns: 58px 1fr 38px 86px;
            align-items: center;
            gap: 10px;
            padding: 5px 0;
            font-size: 12.5px;
        }

        .meter-label {
            color: #B6C2D6;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .meter-bar {
            height: 5px;
            border-radius: 3px;
            background: rgba(130, 170, 220, 0.10);
            overflow: hidden;
        }

        .meter-bar i {
            display: block;
            height: 100%;
            border-radius: 3px;
            background: linear-gradient(90deg, var(--blue), var(--violet));
        }

        .meter-value {
            font-family: var(--mono);
            font-size: 12px;
            text-align: right;
        }

        .level {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 11px;
            color: var(--dim);
            white-space: nowrap;
        }

        /* Separador dentro de la tarjeta de sistema ("Espacio en disco") */
        .card-sub {
            margin: 10px 0 3px;
            padding-top: 9px;
            border-top: 1px solid var(--line);
            font-family: var(--mono);
            font-size: 9.5px;
            letter-spacing: 1.3px;
            text-transform: uppercase;
            color: var(--dim-2);
        }

        .level::before {
            content: '';
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--ok);
        }

        .level.high::before {
            background: var(--warn);
        }

        .level.critical::before {
            background: var(--danger);
        }

        .meter.high .meter-bar i {
            background: linear-gradient(90deg, var(--violet), var(--warn));
        }

        .meter.critical .meter-bar i {
            background: linear-gradient(90deg, var(--warn), var(--danger));
        }

        .card-note {
            margin-top: 9px;
            padding-top: 9px;
            border-top: 1px solid var(--line);
            font-size: 11px;
            color: var(--dim);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-line {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .card-badge {
            width: 38px;
            height: 38px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 11px;
            color: var(--blue);
            background: rgba(57, 198, 255, 0.10);
        }

        .card-badge svg {
            width: 18px;
            height: 18px;
        }

        .card-badge.song {
            color: var(--magenta);
            background: rgba(216, 92, 255, 0.10);
        }

        .card-badge.fail {
            color: var(--danger);
            background: rgba(255, 107, 107, 0.10);
        }

        .card-main {
            min-width: 0;
        }

        .card-main b {
            display: block;
            font-size: 13.5px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-transform: capitalize;
        }

        .card-main.keep-case b {
            text-transform: none;
        }

        .card-main small {
            display: block;
            margin-top: 2px;
            font-size: 11.5px;
            color: var(--dim);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-main small.ok {
            color: var(--ok);
        }

        .card-main small.fail {
            color: var(--danger);
        }

        .file-row {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 7px;
            margin: 0 -7px;
            width: calc(100% + 14px);
            border: none;
            border-radius: 8px;
            background: transparent;
            text-align: left;
            cursor: pointer;
        }

        .file-row:hover {
            background: var(--panel-3);
        }

        .file-row svg {
            width: 15px;
            height: 15px;
            color: var(--dim);
        }

        .file-row:hover svg {
            color: var(--cyan);
        }

        .file-info {
            min-width: 0;
        }

        .file-info b {
            display: block;
            font-size: 12.5px;
            font-weight: 500;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .file-info small {
            display: block;
            font-size: 10.5px;
            color: var(--dim-2);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            direction: rtl;
            text-align: left;
        }

        /* ---------- Tarjeta de guía paso a paso ---------- */
        .card.guide {
            width: min(470px, 100%);
        }

        .guide-title {
            font-size: 14.5px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .guide-intro {
            font-size: 12.5px;
            line-height: 1.55;
            color: #B6C2D6;
        }

        .guide-notes {
            margin: 11px 0 2px;
            padding: 9px 11px;
            border-radius: 9px;
            background: rgba(251, 191, 36, 0.06);
            border: 1px solid rgba(251, 191, 36, 0.18);
        }

        .guide-notes div {
            position: relative;
            padding-left: 13px;
            font-size: 11.5px;
            line-height: 1.5;
            color: #C9D3E3;
        }

        .guide-notes div+div {
            margin-top: 4px;
        }

        .guide-notes div::before {
            content: '';
            position: absolute;
            left: 1px;
            top: 7px;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--warn);
        }

        .guide-step {
            display: flex;
            gap: 11px;
            margin-top: 13px;
        }

        .guide-num {
            width: 21px;
            height: 21px;
            flex-shrink: 0;
            margin-top: 1px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--blue), var(--violet));
            color: #050912;
            font-family: var(--mono);
            font-size: 11px;
            font-weight: 700;
        }

        .guide-step-body {
            min-width: 0;
            flex: 1;
        }

        .guide-step-body b {
            display: block;
            font-size: 13px;
            font-weight: 600;
        }

        .guide-step-body p {
            margin: 3px 0 0;
            font-size: 12.5px;
            line-height: 1.55;
            color: #B6C2D6;
        }

        .guide-copy {
            display: flex;
            align-items: stretch;
            gap: 6px;
            margin-top: 8px;
        }

        .guide-copy code {
            flex: 1;
            min-width: 0;
            padding: 6px 9px;
            border-radius: 7px;
            background: rgba(4, 7, 12, 0.7);
            border: 1px solid var(--line-strong);
            font-family: var(--mono);
            font-size: 11.5px;
            color: var(--cyan);
            overflow-x: auto;
            white-space: nowrap;
            user-select: all;
        }

        .guide-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 11px;
            border-radius: 8px;
            border: 1px solid var(--line-strong);
            background: var(--panel-3);
            color: var(--text);
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
            transition: border-color 0.15s, color 0.15s;
        }

        .guide-btn svg {
            width: 13px;
            height: 13px;
        }

        .guide-btn:hover {
            border-color: var(--cyan);
            color: var(--cyan);
        }

        .guide-step-body .guide-btn {
            margin-top: 8px;
        }

        .guide-problems {
            margin-top: 14px;
            padding-top: 11px;
            border-top: 1px solid var(--line);
        }

        .guide-problems summary {
            font-size: 12.5px;
            color: var(--dim);
            cursor: pointer;
            user-select: none;
        }

        .guide-problems summary:hover {
            color: var(--text);
        }

        .guide-problem {
            margin-top: 10px;
            font-size: 12px;
            line-height: 1.5;
        }

        .guide-problem b {
            display: block;
            font-weight: 600;
            color: var(--text);
        }

        .guide-problem span {
            color: #B6C2D6;
        }

        .guide-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 14px;
        }

        .guide-actions .guide-btn.primary {
            background: linear-gradient(135deg, rgba(57, 198, 255, 0.18), rgba(139, 92, 255, 0.2));
            border-color: rgba(110, 170, 255, 0.35);
        }

        /* ---------- Confirmación de acciones sensibles ---------- */
        .confirm-card {
            align-self: flex-start;
            margin-left: 38px;
            width: min(380px, 86%);
            padding: 13px 15px;
            border-radius: 13px;
            background: linear-gradient(rgba(255, 107, 107, 0.07), rgba(255, 107, 107, 0.07)), rgba(14, 21, 33, 0.90);
            border: 1px solid rgba(255, 107, 107, 0.30);
        }

        .confirm-title {
            font-family: var(--mono);
            font-size: 10px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--danger);
            margin-bottom: 7px;
        }

        .confirm-desc {
            font-size: 13px;
            line-height: 1.5;
            margin-bottom: 12px;
            overflow-wrap: anywhere;
        }

        .confirm-buttons {
            display: flex;
            gap: 8px;
        }

        .confirm-buttons button {
            flex: 1;
            padding: 8px 0;
            border-radius: 9px;
            font-size: 12.5px;
            font-weight: 600;
            cursor: pointer;
        }

        .confirm-yes {
            background: var(--danger);
            border: 1px solid var(--danger);
            color: #1a0b0b;
        }

        .confirm-no {
            background: transparent;
            border: 1px solid var(--line-strong);
            color: var(--text);
        }

        .confirm-buttons button:disabled {
            opacity: 0.5;
            cursor: default;
        }

        /* ---------- Compositor ---------- */
        .composer-wrap {
            flex-shrink: 0;
            padding: 6px 22px 16px;
            position: relative;
        }

        .composer {
            max-width: 756px;
            margin: 0 auto;
            border-radius: 16px;
            background: rgba(11, 17, 27, 0.72);
            -webkit-backdrop-filter: blur(18px) saturate(1.25);
            backdrop-filter: blur(18px) saturate(1.25);
            border: 1px solid rgba(150, 185, 235, 0.14);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.28);
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        /* El brillo solo aparece cuando se está escribiendo. */
        .composer:focus-within {
            border-color: color-mix(in srgb, var(--cyan) 55%, transparent);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.28), 0 0 0 3px rgba(99, 230, 255, 0.07), 0 0 26px rgba(99, 230, 255, 0.12);
        }

        #attachments {
            display: none;
            flex-wrap: wrap;
            gap: 8px;
            padding: 10px 12px 0;
        }

        #attachments.has-items {
            display: flex;
        }

        .attachment {
            position: relative;
            width: 54px;
            height: 54px;
            border-radius: 9px;
            overflow: hidden;
            border: 1px solid var(--line-strong);
        }

        .attachment img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .attachment button {
            position: absolute;
            top: 2px;
            right: 2px;
            width: 17px;
            height: 17px;
            border-radius: 50%;
            border: none;
            background: rgba(7, 11, 18, 0.85);
            color: var(--text);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }

        .attachment button svg {
            width: 9px;
            height: 9px;
            stroke-width: 2.6;
        }

        .attachment button:hover {
            background: var(--danger);
        }

        .composer-row {
            display: flex;
            align-items: flex-end;
            gap: 2px;
            padding: 7px 8px;
        }

        .tool-btn {
            width: 34px;
            height: 34px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            border-radius: 10px;
            background: transparent;
            color: var(--dim);
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
        }

        .tool-btn svg {
            width: 17px;
            height: 17px;
        }

        .tool-btn:hover:not(:disabled) {
            background: var(--panel-3);
            color: var(--text);
        }

        .tool-btn:disabled {
            opacity: 0.35;
            cursor: default;
        }

        #mic-btn.recording {
            background: var(--danger);
            color: #fff;
            animation: rec-pulse 1.2s ease-in-out infinite;
        }

        #song-btn.listening {
            background: color-mix(in srgb, var(--magenta) 85%, transparent);
            color: #fff;
            animation: rec-pulse 1.2s ease-in-out infinite;
        }

        @keyframes rec-pulse {

            0%,
            100% {
                box-shadow: 0 0 0 0 rgba(255, 107, 107, 0.45);
            }

            50% {
                box-shadow: 0 0 0 7px rgba(255, 107, 107, 0);
            }
        }

        #input {
            flex: 1;
            min-width: 0;
            margin: 0 6px;
            padding: 8px 2px;
            background: transparent;
            border: none;
            outline: none;
            resize: none;
            color: var(--text);
            font-family: inherit;
            font-size: 13.5px;
            line-height: 1.4;
            max-height: 130px;
            overflow-y: auto;
        }

        #input::placeholder {
            color: var(--dim-2);
        }

        #send-btn {
            width: 34px;
            height: 34px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--blue), var(--violet));
            color: #050912;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.15s, filter 0.15s;
        }

        #send-btn svg {
            width: 17px;
            height: 17px;
            stroke-width: 2.2;
        }

        #send-btn:hover:not(:disabled) {
            filter: brightness(1.12);
        }

        #send-btn:active:not(:disabled) {
            transform: scale(0.94);
        }

        #send-btn:disabled {
            opacity: 0.35;
            cursor: default;
        }

        /* Aviso al arrastrar una imagen sobre la ventana */
        body.dragging::after {
            content: 'Suelta la imagen aquí';
            position: fixed;
            inset: 10px;
            z-index: 90;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px dashed var(--cyan);
            border-radius: 14px;
            background: rgba(7, 11, 18, 0.88);
            color: var(--cyan);
            font-family: var(--mono);
            font-size: 13px;
            letter-spacing: 1px;
            pointer-events: none;
        }

        /* ---------- Ventanas modales (Atajos, Acerca de) ---------- */
        .modal {
            position: fixed;
            inset: 0;
            z-index: 80;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(4, 7, 12, 0.66);
            padding: 20px;
        }

        .modal[hidden] {
            display: none;
        }

        .modal-box {
            width: min(420px, 100%);
            max-height: calc(100vh - 40px);
            overflow-y: auto;
            padding: 20px 22px 18px;
            border-radius: 16px;
            background: var(--panel-2);
            border: 1px solid var(--line-strong);
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
        }

        .modal-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
            font-size: 14px;
            font-weight: 600;
        }

        .shortcut {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            padding: 8px 0;
            border-top: 1px solid var(--line);
            font-size: 12.5px;
            color: #B6C2D6;
        }

        .shortcut kbd {
            flex-shrink: 0;
            padding: 3px 8px;
            border-radius: 6px;
            background: var(--bg);
            border: 1px solid var(--line-strong);
            font-family: var(--mono);
            font-size: 11px;
            color: var(--text);
        }

        .about {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 8px 0 4px;
        }

        .about .core {
            margin: 6px 0 20px;
        }

        .about b {
            font-size: 16px;
            letter-spacing: 4px;
        }

        .about .version {
            margin-top: 6px;
            font-family: var(--mono);
            font-size: 11px;
            color: var(--blue);
        }

        .about p {
            margin: 10px 0 0;
            font-size: 12.5px;
            line-height: 1.55;
            color: var(--dim);
        }

        /* Datos: quién la hizo, motor y estado */
        .about-info {
            width: 100%;
            margin-top: 16px;
            border-radius: 11px;
            background: rgba(4, 7, 12, 0.4);
            border: 1px solid var(--line);
            text-align: left;
        }

        .about-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            padding: 9px 13px;
            font-size: 12.5px;
        }

        .about-row+.about-row {
            border-top: 1px solid var(--line);
        }

        .about-row>span:first-child {
            color: var(--dim);
            white-space: nowrap;
        }

        .about-row>span:last-child {
            text-align: right;
            color: var(--text);
        }

        .about-status {
            display: inline-flex;
            align-items: center;
            gap: 7px;
        }

        .about-status::before {
            content: '';
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--dim-2);
        }

        .about-status[data-status="connected"]::before {
            background: var(--ok);
            box-shadow: 0 0 8px var(--ok);
        }

        .about-status[data-status="error"]::before,
        .about-status[data-status="no_key"]::before {
            background: var(--warn);
        }

        .about-status[data-status="offline"]::before {
            background: var(--danger);
        }

        /* Acciones */
        .about-actions {
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 12px;
        }

        .about-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 9px 11px;
            border-radius: 10px;
            border: 1px solid var(--line);
            background: var(--panel-3);
            color: var(--text);
            font-size: 12px;
            text-align: left;
            cursor: pointer;
            transition: border-color 0.15s, color 0.15s;
        }

        .about-btn svg {
            width: 14px;
            height: 14px;
            color: var(--blue);
        }

        .about-btn:hover:not(:disabled) {
            border-color: color-mix(in srgb, var(--blue) 55%, transparent);
        }

        .about-btn:disabled {
            opacity: 0.6;
            cursor: default;
        }

        .about-btn.wide {
            grid-column: 1 / -1;
        }

        /* Mensaje bajo los botones (resultado de buscar actualizaciones, etc.) */
        .about-note {
            min-height: 17px;
            margin-top: 10px;
            font-size: 11.5px;
            line-height: 1.5;
            color: var(--cyan);
        }

        .about-links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 4px 14px;
            margin-top: 6px;
            padding-top: 12px;
            width: 100%;
            border-top: 1px solid var(--line);
        }

        .about-links button {
            border: none;
            background: none;
            padding: 0;
            color: var(--dim);
            font-size: 11.5px;
            cursor: pointer;
        }

        .about-links button:hover {
            color: var(--cyan);
            text-decoration: underline;
        }

        .about-copy {
            margin-top: 9px;
            font-size: 10.5px;
            color: var(--dim-2);
        }

        /* Subpáginas: novedades, privacidad, licencias */
        .about-back {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin: -4px 0 12px;
            padding: 0;
            border: none;
            background: none;
            color: var(--dim);
            font-size: 12px;
            cursor: pointer;
        }

        .about-back svg {
            width: 13px;
            height: 13px;
        }

        .about-back:hover {
            color: var(--text);
        }

        .about-section+.about-section {
            margin-top: 15px;
            padding-top: 14px;
            border-top: 1px solid var(--line);
        }

        .about-section h4 {
            display: flex;
            align-items: baseline;
            gap: 9px;
            margin: 0 0 7px;
            font-size: 13px;
            font-weight: 600;
        }

        .about-section h4 small {
            font-family: var(--mono);
            font-size: 10px;
            font-weight: 400;
            color: var(--dim-2);
        }

        .about-section .tag {
            padding: 1px 7px;
            border-radius: 6px;
            background: rgba(57, 198, 255, 0.10);
            color: var(--blue);
            font-family: var(--mono);
            font-size: 11px;
            font-weight: 600;
        }

        .about-item {
            position: relative;
            padding-left: 13px;
            font-size: 12.5px;
            line-height: 1.55;
            color: #B6C2D6;
        }

        .about-item+.about-item {
            margin-top: 5px;
        }

        .about-item::before {
            content: '';
            position: absolute;
            left: 1px;
            top: 8px;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--violet);
        }

        .license-row {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 2px 12px;
            padding: 8px 0;
            font-size: 12.5px;
        }

        .license-row+.license-row {
            border-top: 1px solid var(--line);
        }

        .license-row small {
            grid-column: 1 / -1;
            font-size: 11.5px;
            color: var(--dim);
        }

        .license-row .lic {
            font-family: var(--mono);
            font-size: 11px;
            color: var(--blue);
        }

        .license-row .ver {
            margin-left: 6px;
            font-family: var(--mono);
            font-size: 10.5px;
            color: var(--dim-2);
        }

        .about-footnote {
            margin-top: 12px;
            font-size: 11.5px;
            line-height: 1.5;
            color: var(--dim);
        }

        .about-sub .about-btn {
            margin-top: 14px;
            width: 100%;
        }
    </style>
</head>
