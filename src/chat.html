    <script>
        // ============================================================
        // Iconos (SVG en línea, trazo fino) — así se ven igual en cualquier
        // PC, sin depender de qué emojis tenga instalados Windows.
        // ============================================================
        const ICONS = {
            menu: '<path d="M4 6h16M4 12h16M4 18h16"/>',
            plus: '<path d="M12 5v14M5 12h14"/>',
            send: '<path d="M12 19V5M6 11l6-6 6 6"/>',
            mic: '<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',
            stop: '<rect x="7" y="7" width="10" height="10" rx="2"/>',
            music: '<path d="M9 18V5l11-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="15" r="2.5"/>',
            volume: '<path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/>',
            volumeOff: '<path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M22 9.5l-5 5M17 9.5l5 5"/>',
            sliders: '<path d="M4 6h9M18 6h2M4 12h3M12 12h8M4 18h11M20 18h0"/><circle cx="15.5" cy="6" r="2"/><circle cx="9.5" cy="12" r="2"/><circle cx="17.5" cy="18" r="2"/>',
            dots: '<circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/>',
            star: '<path d="m12 3.5 2.6 5.4 5.9.8-4.3 4.1 1 5.9L12 16.9l-5.2 2.8 1-5.9-4.3-4.1 5.9-.8z"/>',
            trash: '<path d="M4 7h16M9 7V4h6v3M6.5 7l.9 13h9.2l.9-13"/>',
            monitor: '<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>',
            image: '<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="m21 16-5-5-8 9"/>',
            folder: '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
            zap: '<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>',
            info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.2"/>',
            power: '<path d="M12 3v9M6.3 6.8a8 8 0 1 0 11.4 0"/>',
            keyboard: '<rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/>',
            clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
            activity: '<path d="M3 12h4l3-8 4 16 3-8h4"/>',
            copy: '<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/>',
            check: '<path d="m5 12 5 5 9-10"/>',
            file: '<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/>',
            app: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/>',
            x: '<path d="M6 6l12 12M18 6 6 18"/>',
            alert: '<path d="M12 4 2.5 20h19z"/><path d="M12 10v4M12 17v.2"/>',
            external: '<path d="M14 4h6v6M20 4l-9 9M18 14v5H5V6h5"/>',
            list: '<path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/>',
            refresh: '<path d="M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6"/>',
            back: '<path d="M19 12H5M11 6l-6 6 6 6"/>',
        };

        function iconSvg(name) {
            return `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${ICONS[name] || ''}</svg>`;
        }

        // Reemplaza cada <span data-icon="..."> por su SVG.
        function hydrateIcons(root) {
            root.querySelectorAll('[data-icon]').forEach((node) => {
                node.outerHTML = iconSvg(node.dataset.icon);
            });
        }

        // Atajo para crear elementos con clase y texto (el texto SIEMPRE va
        // como textContent: nombres de archivos, títulos, etc. nunca se
        // interpretan como HTML).
        function el(tag, className, text) {
            const node = document.createElement(tag);
            if (className) node.className = className;
            if (text !== undefined && text !== null) node.textContent = text;
            return node;
        }

        hydrateIcons(document);

        const messagesEl = document.getElementById('messages');
        const threadEl = document.getElementById('thread');
        const inputEl = document.getElementById('input');
        const sendBtn = document.getElementById('send-btn');
        const micBtn = document.getElementById('mic-btn');
        const songBtn = document.getElementById('song-btn');
        const statusText = document.getElementById('status-text');
        const welcomeTemplate = document.getElementById('welcome-template');

        // La ruta relativa "../build/avatar.png" solo funciona en modo
        // desarrollo — una vez empaquetada la app, main.ts nos da la ruta
        // real. Empezamos con la relativa y la actualizamos apenas llega.
        let avatarUrl = '../build/avatar.png';

        function applyAvatar(root) {
            root.querySelectorAll('.avatar-img').forEach((img) => (img.src = avatarUrl));
        }

        window.alya.getAvatarUrl().then((url) => {
            avatarUrl = url;
            applyAvatar(document);
        });

        // Lo mismo para el fondo: la ruta real la da main.ts.
        window.alya
            .getBackgroundUrl()
            .then((url) => document.documentElement.style.setProperty('--backdrop-image', `url("${url}")`))
            .catch(() => { });

        // ============================================================
        // Estado de ALYA: el avatar, el punto de la cabecera y el texto de
        // estado reflejan lo que está haciendo de verdad.
        //   escuchando > procesando > hablando > escribiendo > error > en línea
        // ============================================================
        const activity = { recording: false, songListening: false, thinking: 0, speaking: false, writing: 0, errorUntil: 0 };
        const stopSpeakBtn = document.getElementById('stop-speak-btn');

        function refreshState() {
            let state = 'idle';
            let label = 'En línea';

            if (activity.recording || activity.songListening) {
                state = 'listening';
                label = 'Escuchando…';
            } else if (activity.thinking > 0) {
                state = 'thinking';
                label = 'Procesando…';
            } else if (activity.speaking) {
                state = 'speaking';
                label = 'Hablando…';
            } else if (activity.writing > 0) {
                // La respuesta se está escribiendo y no la está diciendo (voz silenciada).
                state = 'thinking';
                label = 'Escribiendo…';
            } else if (Date.now() < activity.errorUntil) {
                state = 'error';
                label = 'Algo falló';
            }

            document.body.dataset.state = state;
            statusText.textContent = label;
            // El botón "Callar" solo tiene sentido mientras está hablando.
            stopSpeakBtn.hidden = !activity.speaking;
        }

        // Muestra el estado de error unos segundos y vuelve solo a la normalidad.
        function flashError() {
            activity.errorUntil = Date.now() + 4000;
            refreshState();
            setTimeout(refreshState, 4100);
        }

        // Las respuestas que arma main.ts cuando algo se rompe empiezan así.
        function looksLikeFailure(text) {
            return /^(Tuve un problema para responder|No pude identificar la canción:)/.test(text || '');
        }

        window.alya.onSpeaking((speaking) => {
            activity.speaking = speaking;
            refreshState();
            // Mientras habla, (si está activado) se queda atenta a si le hablas encima.
            if (speaking) startVoiceWatch();
            else stopVoiceWatch();
        });

        /**
         * Calla a ALYA en el momento: corta la frase y descarta lo que le
         * faltaba decir de esta respuesta. No la deja silenciada (eso es el
         * botón "Voz"): la próxima respuesta la dice normal.
         */
        function interruptSpeech() {
            if (!activity.speaking) return;
            activity.speaking = false;
            refreshState();
            stopVoiceWatch();
            window.alya.stopSpeaking().catch(() => { });
        }

        stopSpeakBtn.addEventListener('click', interruptSpeech);

        // ============================================================
        // Hilo de mensajes
        // ============================================================
        function scrollToEnd() {
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        function showWelcome() {
            threadEl.innerHTML = '';
            threadEl.appendChild(welcomeTemplate.content.cloneNode(true));
            hydrateIcons(threadEl);
            applyAvatar(threadEl);
            document.body.classList.remove('in-chat');
        }

        function removeWelcome() {
            const welcome = document.getElementById('welcome');
            if (welcome) welcome.remove();
            // Con conversación en pantalla el fondo se atenúa (ver .backdrop).
            document.body.classList.add('in-chat');
        }

        function makeAvatar() {
            const avatar = el('div', 'msg-avatar');
            const img = el('img', 'avatar-img');
            img.src = avatarUrl;
            img.alt = 'ALYA';
            avatar.appendChild(img);
            return avatar;
        }

        // ---------- Tarjetas inteligentes ----------
        function levelOf(percent) {
            if (percent >= 90) return { key: 'critical', label: 'Crítico' };
            if (percent >= 75) return { key: 'high', label: 'Alto' };
            return { key: '', label: 'Normal' };
        }

        // Para discos lo que importa es cuánto ESPACIO queda, no un "nivel de
        // uso": recién preocupa cuando está casi lleno.
        function diskLevelOf(percent) {
            if (percent >= 95) return 'critical';
            if (percent >= 88) return 'high';
            return '';
        }

        function cardHead(iconName, title, count) {
            const head = el('div', 'card-head');
            head.innerHTML = iconSvg(iconName);
            head.appendChild(el('span', '', title));
            if (count) head.appendChild(el('span', 'count', count));
            return head;
        }

        // note (opcional): texto que reemplaza a "Normal / Alto / Crítico"
        // (ej. "107 GB libres" en los discos).
        function meterRow(label, percent, note, noteLevel) {
            const level = note === undefined ? levelOf(percent) : { key: noteLevel || '', label: note };
            const row = el('div', `meter ${level.key}`.trim());
            const labelEl = el('span', 'meter-label', label);
            labelEl.title = label;
            row.appendChild(labelEl);

            const bar = el('div', 'meter-bar');
            const fill = document.createElement('i');
            fill.style.width = `${Math.max(2, percent)}%`;
            bar.appendChild(fill);
            row.appendChild(bar);

            row.appendChild(el('span', 'meter-value', `${percent}%`));
            row.appendChild(el('span', `level ${level.key}`.trim(), level.label));
            return row;
        }

        function badgeLine(iconName, badgeClass, title, subtitle, subtitleClass, keepCase) {
            const line = el('div', 'card-line');
            const badge = el('div', `card-badge ${badgeClass || ''}`.trim());
            badge.innerHTML = iconSvg(iconName);
            line.appendChild(badge);

            const main = el('div', keepCase ? 'card-main keep-case' : 'card-main');
            main.appendChild(el('b', '', title));
            if (subtitle) main.appendChild(el('small', subtitleClass || '', subtitle));
            line.appendChild(main);
            return line;
        }

        function renderCard(card) {
            const box = el('div', 'card');

            if (card.type === 'system') {
                box.appendChild(cardHead('monitor', 'Estado del sistema'));
                box.appendChild(meterRow('CPU', card.cpu));
                box.appendChild(meterRow('RAM', card.ram));
                (card.gpus || []).forEach((gpu) => {
                    if (gpu.load !== null && gpu.load !== undefined) box.appendChild(meterRow('GPU', gpu.load));
                });

                // Los discos van aparte: su porcentaje es ESPACIO ocupado, no
                // actividad (el "Disco 3%" del Administrador de tareas es otra cosa).
                if ((card.disks || []).length > 0) {
                    box.appendChild(el('div', 'card-sub', 'Espacio ocupado en disco'));
                    card.disks.forEach((disk) => {
                        const free = disk.freeGB ? `${disk.freeGB} GB libres` : '';
                        box.appendChild(meterRow(disk.mount, disk.use, free, diskLevelOf(disk.use)));
                    });
                }

                const ramText = card.ramUsedGB
                    ? `RAM ${card.ramUsedGB} de ${card.ramTotalGB} GB`
                    : card.ramTotalGB
                        ? `${card.ramTotalGB} GB de RAM`
                        : '';
                const details = [card.cpuModel, ramText].filter(Boolean).join(' · ');
                if (details) {
                    const note = el('div', 'card-note', details);
                    note.title = details;
                    box.appendChild(note);
                }
                return box;
            }

            if (card.type === 'app') {
                box.appendChild(
                    badgeLine(card.ok ? 'app' : 'alert', card.ok ? '' : 'fail', card.name, card.detail, card.ok ? 'ok' : 'fail')
                );
                return box;
            }

            if (card.type === 'files') {
                const shown = card.files.length;
                box.appendChild(cardHead('folder', 'Resultados', card.total > shown ? `${shown} de ${card.total}` : `${card.total}`));
                card.files.forEach((file) => {
                    const row = el('button', 'file-row');
                    row.title = `Mostrar en el Explorador: ${file.path}`;
                    row.innerHTML = iconSvg('file');
                    const info = el('span', 'file-info');
                    info.appendChild(el('b', '', file.name));
                    // La carpeta se muestra recortada por la izquierda (lo útil es el final de la ruta).
                    const folder = file.path.slice(0, Math.max(0, file.path.length - file.name.length)).replace(/[\\/]$/, '');
                    info.appendChild(el('small', '', `‎${folder}`));
                    row.appendChild(info);
                    row.addEventListener('click', () => window.alya.showInFolder(file.path));
                    box.appendChild(row);
                });
                return box;
            }

            if (card.type === 'guide') {
                box.classList.add('guide');
                box.appendChild(cardHead('list', 'Guía paso a paso', `${card.steps.length} pasos`));
                box.appendChild(el('div', 'guide-title', card.title));
                box.appendChild(el('div', 'guide-intro', card.intro));

                if ((card.notes || []).length > 0) {
                    const notes = el('div', 'guide-notes');
                    card.notes.forEach((note) => notes.appendChild(el('div', '', note)));
                    box.appendChild(notes);
                }

                // Botón que abre una página en el navegador del usuario.
                const linkButton = (label, url, extraClass) => {
                    const button = el('button', `guide-btn ${extraClass || ''}`.trim());
                    button.innerHTML = iconSvg('external');
                    button.appendChild(el('span', '', label));
                    button.addEventListener('click', () => window.alya.openLink(url));
                    return button;
                };

                card.steps.forEach((step, index) => {
                    const row = el('div', 'guide-step');
                    row.appendChild(el('div', 'guide-num', String(index + 1)));
                    const body = el('div', 'guide-step-body');
                    body.appendChild(el('b', '', step.title));
                    body.appendChild(el('p', '', step.text));

                    if (step.copy) {
                        const copyRow = el('div', 'guide-copy');
                        copyRow.appendChild(el('code', '', step.copy));
                        const copyBtn = el('button', 'guide-btn');
                        copyBtn.innerHTML = `${iconSvg('copy')}<span>Copiar</span>`;
                        copyBtn.addEventListener('click', () => {
                            navigator.clipboard.writeText(step.copy);
                            copyBtn.innerHTML = `${iconSvg('check')}<span>Copiado</span>`;
                            setTimeout(() => (copyBtn.innerHTML = `${iconSvg('copy')}<span>Copiar</span>`), 1400);
                        });
                        copyRow.appendChild(copyBtn);
                        body.appendChild(copyRow);
                    }
                    if (step.link) body.appendChild(linkButton(step.link.label, step.link.url));

                    row.appendChild(body);
                    box.appendChild(row);
                });

                if ((card.problems || []).length > 0) {
                    const details = el('details', 'guide-problems');
                    details.appendChild(el('summary', '', 'Si algo sale mal'));
                    card.problems.forEach((item) => {
                        const problem = el('div', 'guide-problem');
                        problem.appendChild(el('b', '', item.problem));
                        problem.appendChild(el('span', '', item.fix));
                        details.appendChild(problem);
                    });
                    details.addEventListener('toggle', scrollToEnd);
                    box.appendChild(details);
                }

                if ((card.actions || []).length > 0) {
                    const actions = el('div', 'guide-actions');
                    card.actions.forEach((action) => {
                        if (action.action === 'link' && action.url) {
                            actions.appendChild(linkButton(action.label, action.url, 'primary'));
                        } else if (action.action === 'settings') {
                            const button = el('button', 'guide-btn');
                            button.innerHTML = iconSvg('sliders');
                            button.appendChild(el('span', '', action.label));
                            button.addEventListener('click', () => window.alya.openSettings());
                            actions.appendChild(button);
                        }
                    });
                    box.appendChild(actions);
                }
                return box;
            }

            if (card.type === 'song') {
                const subtitle = [card.artist, card.album].filter(Boolean).join(' · ');
                box.appendChild(cardHead('music', card.label || 'Sonando ahora', card.source || ''));
                box.appendChild(badgeLine('music', 'song', card.title, subtitle, '', true));
                return box;
            }

            return null;
        }

        /**
         * Agrega un mensaje al hilo.
         * extra: { imageUrl, userImages (miniaturas recién adjuntadas),
         *          imageCount (al reabrir: solo se sabe cuántas había), cards }
         */
        function addMessage(role, text, extra) {
            const options = extra || {};
            removeWelcome();

            const row = el('div', `msg-row ${role}`);
            if (role === 'assistant') row.appendChild(makeAvatar());

            const body = el('div', 'msg-body');
            const hasImages = options.userImages && options.userImages.length > 0;

            if (text || options.imageUrl || hasImages || options.imageCount) {
                const bubble = el('div', 'msg');

                if (hasImages) {
                    const gallery = el('div', 'user-images');
                    options.userImages.forEach((url) => {
                        const img = document.createElement('img');
                        img.src = url;
                        gallery.appendChild(img);
                    });
                    bubble.appendChild(gallery);
                    if (text) bubble.appendChild(el('div', 'user-text', text));
                } else if (options.imageCount) {
                    const chip = el('div', 'image-chip');
                    chip.innerHTML = iconSvg('image');
                    chip.appendChild(el('span', '', options.imageCount === 1 ? '1 imagen' : `${options.imageCount} imágenes`));
                    bubble.appendChild(chip);
                    if (text) bubble.appendChild(el('div', 'user-text', text));
                } else {
                    bubble.textContent = text;
                }

                if (role === 'assistant' && text) {
                    const copyBtn = el('button', 'copy-btn');
                    copyBtn.title = 'Copiar';
                    copyBtn.innerHTML = iconSvg('copy');
                    copyBtn.addEventListener('click', () => {
                        navigator.clipboard.writeText(text);
                        copyBtn.innerHTML = iconSvg('check');
                        setTimeout(() => (copyBtn.innerHTML = iconSvg('copy')), 1200);
                    });
                    bubble.appendChild(copyBtn);
                }

                if (options.imageUrl) {
                    const img = document.createElement('img');
                    img.src = options.imageUrl;
                    img.addEventListener('load', scrollToEnd);
                    bubble.appendChild(img);
                }

                body.appendChild(bubble);
            }

            (options.cards || []).forEach((card) => {
                const node = renderCard(card);
                if (node) body.appendChild(node);
            });

            row.appendChild(body);
            threadEl.appendChild(row);
            scrollToEnd();
            return row;
        }

        // Muestra una respuesta de ALYA tal como llega de main.ts.
        function addReply(reply) {
            addMessage('assistant', reply.text, { imageUrl: reply.imageUrl, cards: reply.cards });
            if (reply.pendingConfirmation) addConfirmCard(reply.pendingConfirmation);
            if (looksLikeFailure(reply.text)) flashError();
        }

        /**
         * Pone los puntitos de "pensando" y marca a ALYA como procesando.
         * Devuelve la función que hay que llamar cuando llega la respuesta.
         */
        function startThinking() {
            removeWelcome();
            const row = el('div', 'msg-row assistant');
            row.appendChild(makeAvatar());
            const body = el('div', 'msg-body');
            const bubble = el('div', 'msg');
            bubble.innerHTML = '<div class="thinking-dots"><span></span><span></span><span></span></div>';
            body.appendChild(bubble);
            row.appendChild(body);
            threadEl.appendChild(row);
            scrollToEnd();

            activity.thinking++;
            refreshState();

            let done = false;
            const stop = () => {
                if (done) return;
                done = true;
                row.remove();
                activity.thinking = Math.max(0, activity.thinking - 1);
                refreshState();
            };
            stop.row = row; // por si hay que insertar algo ANTES de los puntitos
            return stop;
        }

        // ============================================================
        // Respuesta en vivo: la burbuja se va llenando mientras ALYA escribe
        // ============================================================
        const liveReplies = new Map();
        let liveCounter = 0;

        window.alya.onChatStream((update) => {
            const live = update && liveReplies.get(update.id);
            if (live) live.update(update);
        });

        /**
         * Empieza una respuesta que va a ir llegando de a poco. Muestra los
         * puntitos de "pensando" hasta que llega el primer texto, y desde ahí
         * una burbuja que se va completando. Cuando la respuesta termina hay
         * que llamar a finish(): la burbuja provisoria se quita y en su lugar
         * va la definitiva (con sus tarjetas, botón de copiar, etc.). finish()
         * devuelve una función para llamar después de agregar la definitiva:
         * si estabas leyendo más arriba, te deja donde estabas.
         *
         * onTranscript: en un mensaje de voz, lo que ALYA entendió llega antes
         * que la respuesta; se le pasa para mostrarlo como mensaje tuyo.
         */
        function startLiveReply(onTranscript) {
            const id = `r${Date.now().toString(36)}-${++liveCounter}`;
            const stopThinking = startThinking();
            let row = null;
            let bubble = null;
            let finished = false;

            const isNearEnd = () => messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 120;

            const live = {
                id,
                transcriptShown: false,
                update({ text, transcript }) {
                    if (finished) return;

                    if (transcript && onTranscript && !live.transcriptShown) {
                        live.transcriptShown = true;
                        onTranscript(transcript);
                        // Tu mensaje va antes de lo que ALYA está por responder.
                        const pending = row || stopThinking.row;
                        if (pending && pending.isConnected) threadEl.appendChild(pending);
                        scrollToEnd();
                    }

                    if (typeof text !== 'string' || !text) return;

                    // Si estabas leyendo más arriba, no te arrastra al final.
                    const nearEnd = isNearEnd();

                    if (!row) {
                        stopThinking();
                        row = el('div', 'msg-row assistant');
                        row.appendChild(makeAvatar());
                        const body = el('div', 'msg-body');
                        bubble = el('div', 'msg live');
                        body.appendChild(bubble);
                        row.appendChild(body);
                        threadEl.appendChild(row);
                        activity.writing++;
                        refreshState();
                    }

                    bubble.textContent = text;
                    if (nearEnd) scrollToEnd();
                },
                finish() {
                    if (finished) return () => { };
                    finished = true;
                    liveReplies.delete(id);
                    stopThinking();

                    const stayAt = row && !isNearEnd() ? messagesEl.scrollTop : null;
                    if (row) {
                        row.remove();
                        activity.writing = Math.max(0, activity.writing - 1);
                        refreshState();
                    }
                    return () => {
                        if (stayAt !== null) messagesEl.scrollTop = stayAt;
                    };
                },
            };

            liveReplies.set(id, live);
            return live;
        }

        function addConfirmCard(pending) {
            const card = el('div', 'confirm-card');
            card.appendChild(el('div', 'confirm-title', 'Confirmación necesaria'));
            card.appendChild(el('div', 'confirm-desc', pending.description));

            const buttonsRow = el('div', 'confirm-buttons');
            const yesBtn = el('button', 'confirm-yes', 'Sí, hazlo');
            const noBtn = el('button', 'confirm-no', 'No, cancelar');

            const answer = async (action) => {
                yesBtn.disabled = true;
                noBtn.disabled = true;
                const reply = await action();
                card.remove();
                addReply(reply);
                refreshConversations();
            };

            yesBtn.addEventListener('click', () => answer(() => window.alya.confirmAction()));
            noBtn.addEventListener('click', () => answer(() => window.alya.cancelAction()));

            buttonsRow.appendChild(yesBtn);
            buttonsRow.appendChild(noBtn);
            card.appendChild(buttonsRow);

            threadEl.appendChild(card);
            scrollToEnd();
        }

        // ============================================================
        // Imágenes adjuntas
        // ============================================================
        const attachBtn = document.getElementById('attach-btn');
        const fileInput = document.getElementById('file-input');
        const attachmentsEl = document.getElementById('attachments');
        const MAX_IMAGES = 4; // mismo tope que valida main.ts
        const MAX_IMAGE_SIDE = 1568; // px del lado más largo — más grande no ayuda y solo pesa

        // Cada elemento: { mimeType, data (base64 sin prefijo), previewUrl }
        let pendingImages = [];

        /**
         * Convierte cualquier imagen que Chromium sepa abrir (png, jpg, webp,
         * gif, bmp...) a un JPEG de tamaño razonable. Así se manda siempre
         * un formato que Gemini acepta, y una captura 4K no viaja entera.
         */
        function fileToChatImage(file) {
            return new Promise((resolve, reject) => {
                const objectUrl = URL.createObjectURL(file);
                const img = new Image();
                img.onload = () => {
                    URL.revokeObjectURL(objectUrl);
                    const scale = Math.min(1, MAX_IMAGE_SIDE / Math.max(img.naturalWidth, img.naturalHeight));
                    const canvas = document.createElement('canvas');
                    canvas.width = Math.max(1, Math.round(img.naturalWidth * scale));
                    canvas.height = Math.max(1, Math.round(img.naturalHeight * scale));
                    const ctx = canvas.getContext('2d');
                    // Fondo blanco: JPEG no tiene transparencia (sin esto, un PNG
                    // transparente quedaría con fondo negro).
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    const dataUrl = canvas.toDataURL('image/jpeg', 0.92);
                    resolve({ mimeType: 'image/jpeg', data: dataUrl.split(',')[1], previewUrl: dataUrl });
                };
                img.onerror = () => {
                    URL.revokeObjectURL(objectUrl);
                    reject(new Error('No pude abrir esa imagen.'));
                };
                img.src = objectUrl;
            });
        }

        function renderAttachments() {
            attachmentsEl.innerHTML = '';
            pendingImages.forEach((image, index) => {
                const item = el('div', 'attachment');

                const thumb = document.createElement('img');
                thumb.src = image.previewUrl;
                item.appendChild(thumb);

                const removeBtn = document.createElement('button');
                removeBtn.title = 'Quitar';
                removeBtn.innerHTML = iconSvg('x');
                removeBtn.addEventListener('click', () => {
                    pendingImages.splice(index, 1);
                    renderAttachments();
                });
                item.appendChild(removeBtn);

                attachmentsEl.appendChild(item);
            });
            attachmentsEl.classList.toggle('has-items', pendingImages.length > 0);
        }

        async function addImageFiles(fileList) {
            const files = Array.from(fileList).filter((file) => file.type.startsWith('image/'));
            if (files.length === 0) return;

            for (const file of files) {
                if (pendingImages.length >= MAX_IMAGES) {
                    addMessage('assistant', `Puedo recibir hasta ${MAX_IMAGES} imágenes por mensaje.`);
                    break;
                }
                try {
                    pendingImages.push(await fileToChatImage(file));
                } catch (err) {
                    addMessage('assistant', err.message);
                }
            }

            renderAttachments();
            inputEl.focus();
        }

        // Saca las imágenes pendientes (para mandarlas) y limpia la fila.
        function takePendingImages() {
            const images = pendingImages;
            pendingImages = [];
            renderAttachments();
            return images;
        }

        // Lo que viaja a main.ts: sin la miniatura, solo lo que necesita Gemini.
        function toPayload(images) {
            return images.map(({ mimeType, data }) => ({ mimeType, data }));
        }

        // 1) Botón ＋
        attachBtn.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', () => {
            addImageFiles(fileInput.files);
            fileInput.value = ''; // permite volver a elegir el mismo archivo
        });

        // 2) Pegar con Ctrl+V (ej. un recorte de Win+Shift+S)
        document.addEventListener('paste', (e) => {
            const files = Array.from(e.clipboardData?.files ?? []).filter((file) => file.type.startsWith('image/'));
            if (files.length === 0) return; // texto normal: se pega como siempre
            e.preventDefault();
            addImageFiles(files);
        });

        // 3) Arrastrar y soltar sobre la ventana. Hay que cancelar SIEMPRE
        // dragover/drop: si no, Electron abre el archivo en vez del chat.
        let dragDepth = 0;
        window.addEventListener('dragenter', (e) => {
            e.preventDefault();
            dragDepth++;
            document.body.classList.add('dragging');
        });
        window.addEventListener('dragover', (e) => e.preventDefault());
        window.addEventListener('dragleave', () => {
            dragDepth = Math.max(0, dragDepth - 1);
            if (dragDepth === 0) document.body.classList.remove('dragging');
        });
        window.addEventListener('drop', (e) => {
            e.preventDefault();
            dragDepth = 0;
            document.body.classList.remove('dragging');
            if (e.dataTransfer?.files?.length) addImageFiles(e.dataTransfer.files);
        });

        // ============================================================
        // Enviar un mensaje
        // ============================================================
        async function send() {
            const text = inputEl.value.trim();
            if (!text && pendingImages.length === 0) return;

            const images = takePendingImages();
            addMessage('user', text, { userImages: images.map((image) => image.previewUrl) });
            inputEl.value = '';
            inputEl.style.height = 'auto';
            sendBtn.disabled = true;

            // (Si ALYA todavía estaba diciendo la respuesta anterior, main.ts la
            // calla al recibir este mensaje.)
            const live = startLiveReply();

            try {
                const reply = await window.alya.sendChatMessage(text, toPayload(images), live.id);
                const keepScroll = live.finish();
                addReply(reply);
                keepScroll();
            } catch (err) {
                live.finish();
                addMessage('assistant', 'Algo falló al conectar con ALYA: ' + err.message);
                flashError();
            }

            sendBtn.disabled = false;
            inputEl.focus();
            refreshConversations();
        }

        sendBtn.addEventListener('click', send);
        inputEl.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                if (!sendBtn.disabled) send();
            }
        });

        // El input crece con el texto (hasta un máximo, después scrollea)
        inputEl.addEventListener('input', () => {
            inputEl.style.height = 'auto';
            inputEl.style.height = inputEl.scrollHeight + 'px';
        });

        // Acciones rápidas de la pantalla inicial. "send" manda el mensaje
        // de una; "fill" deja el comienzo escrito para que lo completes.
        threadEl.addEventListener('click', (e) => {
            const card = e.target.closest('.quick-card');
            if (!card) return;
            inputEl.value = card.dataset.msg;
            if (card.dataset.quick === 'send') {

        function groupLabel(timestamp) {
            const startOfToday = new Date();
            startOfToday.setHours(0, 0, 0, 0);
            const days = Math.floor((startOfToday.getTime() - timestamp) / 86400000) + 1;
            if (timestamp >= startOfToday.getTime()) return 'Hoy';
            if (days === 1) return 'Ayer';
            if (days <= 7) return 'Esta semana';
            return 'Anteriores';
        }

        function renderConversations() {
            convListEl.innerHTML = '';

                return;

            let lastGroup = null;
            visible.forEach((conversation) => {
                const group = groupLabel(conversation.updatedAt);
                if (group !== lastGroup) {
                    convListEl.appendChild(el('div', 'conv-group', group));
                    lastGroup = group;
                }

                const item = el('div', 'conv-item');
                if (conversation.id === currentConversationId) item.classList.add('active');

                const title = el('span', 'conv-title', conversation.title);

        // ============================================================
        // Interrumpirla con la voz (opcional: Configuración → "Interrumpirla
        // con mi voz"). Mientras ALYA habla se mide el volumen del micrófono;
        // si empiezas a hablar encima, se calla. No se graba ni se envía nada.
        // ============================================================

        /**
         * Decide, a partir del volumen del micrófono, si la persona empezó a
         * hablar encima de ALYA. Recibe el volumen y la hora (no toca el
         * micrófono), así se puede probar sin audio real.
         *   1. Antes de que suene nada: mide el ruido de fondo.
         *   2. Primer tramo de audio: mide cuánto de la voz de ALYA le llega
         *      al micrófono (con audífonos, casi nada; con parlantes, bastante).
         *   3. Después: si el volumen supera con claridad ambas cosas, y de
         *      forma sostenida (no un golpe o un clic), es la persona hablando.
         */
        function createVoiceDetector() {
            const CALIBRATION_MS = 1200; // cuánto se escucha a ALYA antes de dejarse interrumpir
            const HOLD_MS = 260; // cuánto tiene que durar la voz para contar
            const MIN_LEVEL = 0.03; // por debajo de esto no es voz cerca del micrófono

            let ambient = 0;
            let ambientSamples = 0;
            let playingSince = null;
            let echoPeak = 0;
            let smooth = 0;
            let loudSince = null;

            return {
                /** Avisa que el audio de ALYA empezó a sonar (solo cuenta la primera vez). */
                playbackStarted(now) {
                    if (playingSince === null) playingSince = now;
                },
                /** level: volumen RMS (0 a 1). Devuelve true cuando hay que callarla. */
                push(level, now) {
                    smooth = smooth * 0.6 + level * 0.4;

                    if (playingSince === null) {
                        ambientSamples++;
                        ambient += (level - ambient) / Math.min(ambientSamples, 40);
                        return false;
                    }
                    if (now - playingSince < CALIBRATION_MS) {
                        echoPeak = Math.max(echoPeak, smooth);
                        return false;
                    }

                    const threshold = Math.max(MIN_LEVEL, ambient * 4, echoPeak * 2.2);
                    if (smooth > threshold) {
                        if (loudSince === null) loudSince = now;
                        return now - loudSince >= HOLD_MS;
                    }
                    if (smooth < threshold * 0.7) loudSince = null;
                    return false;
                },
            };
        }

        const voiceWatch = { starting: false, stream: null, context: null, timer: null, detector: null, playedAt: null };

        async function startVoiceWatch() {
            if (voiceWatch.starting || voiceWatch.stream || isRecording || activity.songListening) return;
            voiceWatch.starting = true;
            voiceWatch.playedAt = null;

            let stream = null;
            try {
                const settings = await window.alya.getSettings();
                if (!settings || settings.voiceInterrupt !== true || !activity.speaking) return;

                stream = await navigator.mediaDevices.getUserMedia({
                    audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: false },
                });
                // Mientras se abría el micrófono pudo haber terminado de hablar.
                if (!activity.speaking || isRecording) {
                    stopStream(stream);
                    return;
                }

                const context = new AudioContext();
                const analyser = context.createAnalyser();
                analyser.fftSize = 1024;
                context.createMediaStreamSource(stream).connect(analyser);
                const samples = new Float32Array(analyser.fftSize);

                const detector = createVoiceDetector();
                if (voiceWatch.playedAt !== null) detector.playbackStarted(voiceWatch.playedAt);

                voiceWatch.stream = stream;
                voiceWatch.context = context;
                voiceWatch.detector = detector;
                voiceWatch.timer = setInterval(() => {
                    analyser.getFloatTimeDomainData(samples);
                    let sum = 0;
                    for (let i = 0; i < samples.length; i++) sum += samples[i] * samples[i];
                    const level = Math.sqrt(sum / samples.length);
                    if (detector.push(level, performance.now())) {
                        console.log('[ALYA] Te escuché hablar: me callo.');
                        interruptSpeech();
                    }
                }, 40);
            } catch (err) {
                stopStream(stream);
                console.warn('No se pudo usar el micrófono para dejarse interrumpir:', err.message);
            } finally {
                voiceWatch.starting = false;
            }
        }

        function stopVoiceWatch() {
            if (voiceWatch.timer) clearInterval(voiceWatch.timer);
            stopStream(voiceWatch.stream);
            if (voiceWatch.context) voiceWatch.context.close().catch(() => { });
            voiceWatch.timer = null;
            voiceWatch.stream = null;
            voiceWatch.context = null;
            voiceWatch.detector = null;
        }

        // El audio empezó a sonar de verdad (antes de eso solo se preparaba).
        window.alya.onVoicePlaying(() => {
            const now = performance.now();
            if (voiceWatch.playedAt === null) voiceWatch.playedAt = now;
            if (voiceWatch.detector) voiceWatch.detector.playbackStarted(now);
        });

        // ============================================================
        // Control por voz (micrófono)
        // ============================================================
        let mediaRecorder = null;
        let audioChunks = [];
        let isRecording = false;

        function blobToBase64(blob) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onloadend = () => {
                    // reader.result es algo como "data:audio/webm;codecs=opus;base64,AAAA..."
                    // solo nos interesa la parte después de la coma.
                    const base64 = reader.result.split(',')[1];
                    resolve(base64);
                };
                reader.onerror = reject;
                reader.readAsDataURL(blob);
            });
        }

        /**
         * Combina el micrófono con el audio del sistema (lo que suena por tus
         * parlantes/audífonos — incluye llamadas de Discord, videos, etc.) en
         * una sola grabación mezclada. Si el audio del sistema no se puede
         * capturar por alguna razón, sigue funcionando solo con el micrófono
         * (no rompe el control por voz por esto).
         */
        async function getMixedRecordingStream() {
            const micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            const tracksToStopOnEnd = [...micStream.getTracks()];

            let systemStream = null;
            try {
                const rawSystemStream = await navigator.mediaDevices.getDisplayMedia({
                    video: { width: 1, height: 1 },
                    audio: true,
                });
                rawSystemStream.getVideoTracks().forEach((track) => {
                    track.stop();
                    rawSystemStream.removeTrack(track);
                });
                if (rawSystemStream.getAudioTracks().length > 0) {
                    systemStream = rawSystemStream;
                    tracksToStopOnEnd.push(...systemStream.getTracks());
                }
            } catch (err) {
                // No se pudo capturar el audio del sistema (ej. nada sonando, o
                // el usuario canceló el permiso) — seguimos solo con el micrófono.
                console.warn('No se pudo capturar audio del sistema, solo micrófono:', err.message);
            }

            if (!systemStream) {
                return { stream: micStream, tracksToStopOnEnd };
            }

            // Mezclamos ambas fuentes en una sola pista de audio usando el
            // Web Audio API — así el .wav final tiene tu voz Y lo que suena
            // por el sistema, todo junto.
            const audioContext = new AudioContext();
            const destination = audioContext.createMediaStreamDestination();

            audioContext.createMediaStreamSource(micStream).connect(destination);
            audioContext.createMediaStreamSource(systemStream).connect(destination);

            return { stream: destination.stream, tracksToStopOnEnd };
        }

        function setRecordingUi(recording) {
            isRecording = recording;
            activity.recording = recording;
            micBtn.classList.toggle('recording', recording);
            micBtn.innerHTML = iconSvg(recording ? 'stop' : 'mic');
            refreshState();
        }

        async function startRecording() {
            // Le vas a hablar: si ALYA estaba hablando, se calla (además, la
            // grabación incluye el audio del PC y su voz se colaría en tu mensaje).
            activity.speaking = false;
            stopVoiceWatch();
            window.alya.stopSpeaking().catch(() => { });

            try {
                const { stream, tracksToStopOnEnd } = await getMixedRecordingStream();
                audioChunks = [];
                mediaRecorder = new MediaRecorder(stream);

                mediaRecorder.addEventListener('dataavailable', (e) => {
                    if (e.data.size > 0) audioChunks.push(e.data);
                });

                mediaRecorder.addEventListener('stop', async () => {
                    // Soltamos el micrófono y el audio del sistema (apaga los
                    // íconos de "en uso" del SO).
                    tracksToStopOnEnd.forEach((track) => track.stop());

                    if (audioChunks.length === 0) return;

                    const blob = new Blob(audioChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
                    const base64 = await blobToBase64(blob);

                    // Si había imágenes adjuntas, van junto con lo que dijiste
                    // (ej. adjuntas una captura y preguntas por voz "¿qué es esto?").
                    const images = takePendingImages();

                    const showTranscript = (transcript) =>
                        addMessage('user', transcript, { userImages: images.map((image) => image.previewUrl) });

                    // Lo que entendió llega primero (se muestra como mensaje tuyo)
                    // y después la respuesta, que se va escribiendo en vivo.
                    const live = startLiveReply(showTranscript);
                    micBtn.disabled = true;
                    sendBtn.disabled = true;

                    try {
                        const { transcript, reply } = await window.alya.sendVoiceMessage(
                            base64,
                            mediaRecorder.mimeType || 'audio/webm',
                            toPayload(images),
                            live.id
                        );
                        const keepScroll = live.finish();
                        if (transcript) {
                            if (!live.transcriptShown) showTranscript(transcript);
                        } else {
                            // No se escuchó nada: las imágenes no se mandaron,
                            // las devolvemos a la fila para no perderlas.
                            pendingImages = images;
                            renderAttachments();
                        }
                        addReply(reply);
                        keepScroll();
                    } catch (err) {
                        live.finish();
                        pendingImages = images; // no se mandaron: se devuelven a la fila
                        renderAttachments();
                        addMessage('assistant', 'No pude procesar el audio: ' + err.message);
                        flashError();
                    }

                    micBtn.disabled = false;
                    sendBtn.disabled = false;
                    refreshConversations();
                });

                mediaRecorder.start();
                setRecordingUi(true);
            } catch (err) {
                addMessage(
                    'assistant',
                    'No pude acceder al micrófono. Revisa que Windows le dé permiso a ALYA en ' +
                    'Configuración → Privacidad → Micrófono.'
                );
                flashError();
            }
        }

        function stopRecording() {
            if (mediaRecorder && isRecording) {
                mediaRecorder.stop();
                setRecordingUi(false);
            }
        }

        function toggleRecording() {
            if (isRecording) {
                stopRecording();
            } else {
                startRecording();
            }
        }

        micBtn.addEventListener('click', toggleRecording);

        // Atajo global (Ctrl+Shift+1 por defecto): interruptor — si no está
        // grabando, arranca; si ya está grabando, detiene y manda el audio.
        window.alya.onTriggerVoice(toggleRecording);

        // ============================================================
        // Identificar canción
        // ============================================================
        // Qué está sonando lo decide main.ts (ver songRecognition.ts): primero
        // mira lo que Windows reporta (Spotify, YouTube en el navegador...) y
        // solo si hace falta le pide a esta ventana que ESCUCHE. Escuchar es:
        //   1) grabar el audio del sistema (lo que suena por tus parlantes o
        //      audífonos: Discord, un juego, un video, lo que sea);
        //   2) si por el sistema no suena nada, grabar el micrófono (la
        //      canción viene de afuera del PC);
        //   3) comparar un clip corto contra la base de huellas y, si no hay
        //      coincidencia, seguir grabando y probar con uno más largo.
        const SONG_CLIP_SECONDS = [8, 16]; // primer intento y segundo (acumulado)
        const SILENCE_CHECK_MS = 1500;
        const SILENCE_PEAK = 0.004; // por debajo de esto, se considera que no suena nada

        const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

        function stopStream(stream) {
            if (stream) stream.getTracks().forEach((track) => track.stop());
        }

        // Audio DEL SISTEMA. getDisplayMedia exige pedir video, así que se
        // pide mínimo y se descarta enseguida, quedándonos solo con el audio.
        async function openSystemAudio() {
            const stream = await navigator.mediaDevices.getDisplayMedia({
                video: { width: 1, height: 1 },
                audio: true,
            });
            stream.getVideoTracks().forEach((track) => {
                track.stop();
                stream.removeTrack(track);
            });
            if (stream.getAudioTracks().length === 0) {
                stopStream(stream);
                return null;
            }
            return stream;
        }

        // ¿Está en silencio lo que se captura? Mira el volumen durante un
        // momento; apenas detecta sonido corta y responde que no.
        async function isStreamSilent(stream) {
            let audioContext = null;
            try {
                audioContext = new AudioContext();
                if (audioContext.state !== 'running') {
                    await Promise.race([audioContext.resume(), sleep(300)]);
                }
                // Si no se puede medir, se asume que SÍ hay sonido (mejor intentar
                // identificar que descartar el audio del sistema por error).
                if (audioContext.state !== 'running') return false;

                const analyser = audioContext.createAnalyser();
                analyser.fftSize = 2048;
                audioContext.createMediaStreamSource(stream).connect(analyser);
                const samples = new Float32Array(analyser.fftSize);

                const until = Date.now() + SILENCE_CHECK_MS;
                while (Date.now() < until) {
                    await sleep(100);
                    analyser.getFloatTimeDomainData(samples);
                    for (let i = 0; i < samples.length; i++) {
                        if (Math.abs(samples[i]) > SILENCE_PEAK) return false;
                    }
                }
                return true;
            } catch (err) {
                return false;
            } finally {
                if (audioContext) audioContext.close().catch(() => { });
            }
        }

        // Graba de corrido y va probando: a los 8 s manda lo grabado; si no
        // hubo coincidencia sigue grabando y a los 16 s manda TODO lo grabado
        // (un clip más largo le da más material a la base de huellas).
        async function recordAndIdentify(stream) {
            const recorder = new MediaRecorder(stream);
            const mimeType = recorder.mimeType || 'audio/webm';
            const chunks = [];
            let onChunk = null;

            recorder.addEventListener('dataavailable', (e) => {
                if (e.data.size > 0) chunks.push(e.data);
                if (onChunk) {
                    onChunk();
                    onChunk = null;
                }
            });

            // Le pide a la grabadora lo que lleva grabado hasta ahora.
            const flush = () =>
                Promise.race([
                    new Promise((resolve) => {
                        onChunk = resolve;
                        recorder.requestData();
                    }),
                    sleep(1500),
                ]);

            recorder.start();
            const startedAt = Date.now();

            try {
                for (const seconds of SONG_CLIP_SECONDS) {
                    const remaining = startedAt + seconds * 1000 - Date.now();
                    if (remaining > 0) await sleep(remaining);
                    await flush();
                    if (chunks.length === 0) continue;

                    const base64 = await blobToBase64(new Blob(chunks, { type: mimeType }));
                    const { match, error } = await window.alya.identifyClip(base64, mimeType);
                    if (error) throw new Error(error); // ej. token de AudD inválido: no tiene sentido seguir grabando
                    if (match) return match;
                }
                return null;
            } finally {
                if (recorder.state !== 'inactive') recorder.stop();
            }
        }

        /**
         * Escucha lo que suena e intenta identificarlo. Devuelve
         * { match, source, error? } — source es 'sistema' o 'microfono'.
         * La llama main.ts (window.alyaListenForSong) cuando hace falta.
         */
        async function listenForSong() {
            if (activity.songListening) {
                return { match: null, source: null, error: 'Ya estoy escuchando una canción.' };
            }
            activity.songListening = true;
            songBtn.classList.add('listening');
            refreshState();

            let stream = null;
            let source = 'sistema';

            try {
                stream = await openSystemAudio().catch(() => null);
                if (stream && (await isStreamSilent(stream))) {
                    stopStream(stream);
                    stream = null;
                }

                if (!stream) {
                    // Por el PC no suena nada: la canción viene de afuera. Se
                    // apagan los filtros de voz del micrófono, que deforman la música.
                    source = 'microfono';
                    stream = await navigator.mediaDevices.getUserMedia({
                        audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false },
                    });
                }

                const match = await recordAndIdentify(stream);
                return { match, source };
            } catch (err) {
                // Los errores que vienen de main.ts llegan con un prefijo técnico de Electron.
                const message = String(err && err.message ? err.message : err).replace(
                    /^Error invoking remote method '[^']+':\s*(Error:\s*)?/,
                    ''
                );
                return { match: null, source, error: message };
            } finally {
                stopStream(stream);
                activity.songListening = false;
                songBtn.classList.remove('listening');
                refreshState();
            }
        }

        window.alyaListenForSong = listenForSong;

        songBtn.addEventListener('click', async () => {
            songBtn.disabled = true;
            micBtn.disabled = true;

            const stopThinking = startThinking();

            try {
                const reply = await window.alya.identifySong();
                stopThinking();
                addReply(reply);
            } catch (err) {
                stopThinking();
                addMessage('assistant', 'No pude identificar la canción: ' + err.message);
                flashError();
            }

            songBtn.disabled = false;
            micBtn.disabled = false;
            refreshConversations();
        });

        // ============================================================
        // Arranque
        // ============================================================
        setSidebar(initialSidebarState(), false);
        showWelcome();
        refreshState();
        refreshConversations();
        inputEl.focus();
    </script>
</body>

</html>
